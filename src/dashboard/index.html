<!doctype html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Auroic Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Sora:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
    :root {
      --bg: #090b12;
      --bg-soft: #0f1320;
      --surface: #12182a;
      --surface-2: #192136;
      --border: #273149;
      --muted: #51607f;
      --text: #f3f6ff;
      --subtle: #a0afcf;
      --accent: #ff4f84;
      --accent-2: #a85c26;
      --green: #4ec08f;
      --red: #ff5e6d;
      --yellow: #ffc062;
      --mono: "JetBrains Mono", monospace;
      --sans: "Sora", sans-serif;
      --sidebar-w: 248px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      scrollbar-width: none;
    }

    *::-webkit-scrollbar {
      display: none;
    }

    body {
      font-family: var(--sans);
      background:
        radial-gradient(circle at 20% -10%,
          rgba(255, 79, 132, 0.12),
          transparent 40%),
        radial-gradient(circle at 85% 5%,
          rgba(255, 143, 63, 0.11),
          transparent 36%),
        linear-gradient(180deg, #0a0d18 0%, #07090f 100%);
      color: var(--text);
      display: flex;
      height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
    }

    /* Sidebar */
    aside {
      width: var(--sidebar-w);
      flex-shrink: 0;
      background: linear-gradient(180deg,
          rgba(25, 33, 54, 0.9),
          rgba(16, 22, 38, 0.95));
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 0;
      overflow-y: auto;
    }

    .sidebar-logo {
      padding: 20px 22px 15px;
      font-size: 19px;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: #ffffff;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
      background: linear-gradient(180deg,
          rgba(25, 33, 54, 0.95),
          rgba(16, 22, 38, 0.95));
    }

    .sidebar-logo span {
      color: var(--subtle);
      font-size: 11px;
      display: block;
      margin-top: 5px;
    }

    .conn-badge {
      display: none;
    }

    .conn-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--muted);
    }

    .conn-dot.live {
      background: var(--green);
      box-shadow: 0 0 4px var(--green);
    }

    nav {
      flex: 1;
      padding: 12px 8px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 0 6px 4px;
      border-radius: 12px;
      padding: 10px 14px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      color: var(--subtle);
      transition:
        background 0.1s,
        color 0.1s;
      gap: 8px;
    }

    .nav-item:hover {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
    }

    .nav-item.active {
      background: linear-gradient(90deg,
          rgba(255, 79, 132, 0.2),
          rgba(255, 143, 63, 0.12));
      color: #ffffff;
      box-shadow: inset 0 0 0 1px rgba(255, 143, 63, 0.25);
    }

    .nav-item .icon {
      min-width: 18px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .nav-item .icon svg {
      width: 16px;
      height: 16px;
      stroke-width: 1.75;
    }

    .nav-badge {
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      color: #fff;
      font-size: 10px;
      font-family: var(--mono);
      border-radius: 9px;
      padding: 1px 6px;
      min-width: 20px;
      text-align: center;
    }

    .nav-badge.new {
      background: var(--green);
      animation: pulse 0.8s ease-in-out infinite alternate;
    }

    @keyframes pulse {
      from {
        opacity: 1;
      }

      to {
        opacity: 0.5;
      }
    }

    .sidebar-footer {
      padding: 16px 22px;
      border-top: 1px solid var(--border);
      font-size: 11px;
      color: var(--muted);
      font-family: var(--mono);
    }

    /* Main */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      overflow: hidden;
    }

    .topbar {
      height: 60px;
      background: rgba(15, 19, 32, 0.9);
      backdrop-filter: blur(6px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      flex-direction: row;
      padding: 0 20px;
      gap: 12px;
      flex-shrink: 0;
    }

    .topbar h1 {
      font-size: 17px;
      font-weight: 700;
      flex: 1;
    }

    .topbar input {
      background: var(--bg-soft);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 9px 14px;
      color: var(--text);
      font-size: 12px;
      width: 240px;
      font-family: var(--mono);
    }

    .topbar input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .btn {
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      color: #fff;
      border: none;
      border-radius: 999px;
      padding: 8px 15px;
      font-size: 12px;
      cursor: pointer;
      font-family: var(--sans);
      font-weight: 600;
    }

    .btn:hover {
      opacity: 0.85;
    }

    .btn.secondary {
      background: rgba(255, 255, 255, 0.07);
      color: var(--text);
    }

    .content {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      min-width: 0;
    }

    /* Cards / tables */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 14px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: rgba(18, 24, 42, 0.9);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px 20px;
    }

    .stat-card .val {
      font-family: var(--mono);
      font-size: 26px;
      font-weight: 500;
      color: var(--accent);
    }

    .stat-card .lbl {
      font-size: 12px;
      color: var(--subtle);
      margin-top: 4px;
    }

    .card {
      background: rgba(18, 24, 42, 0.9);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow-x: auto;
      overflow-y: hidden;
      margin-bottom: 20px;
    }

    .card-header {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th {
      padding: 10px 16px;
      text-align: left;
      font-family: var(--mono);
      font-size: 10px;
      color: var(--muted);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      border-bottom: 1px solid var(--border);
    }

    td {
      padding: 10px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      color: var(--text);
      font-family: var(--mono);
      font-size: 12px;
      vertical-align: top;
      max-width: 300px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    tr:last-child td {
      border-bottom: none;
    }

    tr:hover td {
      background: rgba(255, 255, 255, 0.03);
    }

    .tag {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-family: var(--mono);
    }

    .tag.text {
      background: rgba(124, 111, 255, 0.15);
      color: var(--accent);
    }

    .tag.ignore {
      background: rgba(64, 64, 79, 0.4);
      color: var(--subtle);
    }

    .tag.react {
      background: rgba(224, 176, 85, 0.15);
      color: var(--yellow);
    }

    .tag.ack {
      background: rgba(76, 175, 138, 0.15);
      color: var(--green);
    }

    .tag.media {
      background: rgba(224, 85, 85, 0.15);
      color: var(--red);
    }

    .empty {
      padding: 40px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      font-family: var(--mono);
    }

    /* Live feed */
    .live-feed {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .feed-item {
      background: rgba(18, 24, 42, 0.94);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      font-family: var(--mono);
      font-size: 12px;
      animation: slideIn 0.25s ease-out;
    }

    .feed-item .feed-time {
      color: var(--muted);
      font-size: 10px;
      float: right;
    }

    .feed-item .feed-type {
      color: var(--accent);
      margin-right: 8px;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-6px);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* Config editor */
    .config-editor {
      display: flex;
      gap: 20px;
    }

    .config-nav {
      width: 180px;
      flex-shrink: 0;
    }

    .config-nav-item {
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      color: var(--subtle);
      transition:
        background 0.1s,
        color 0.1s;
      margin-bottom: 2px;
    }

    .config-nav-item:hover {
      background: rgba(255, 255, 255, 0.04);
      color: var(--text);
    }

    .config-nav-item.active {
      background: linear-gradient(90deg,
          rgba(255, 79, 132, 0.22),
          rgba(255, 143, 63, 0.1));
      color: #fff;
    }

    .config-body {
      flex: 1;
    }

    .fields-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .field-card {
      background: rgba(18, 24, 42, 0.8);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      transition: border-color 0.15s;
    }

    .field-card.modified {
      border-color: var(--yellow);
    }

    .field-label {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--subtle);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--yellow);
    }

    .field-input {
      width: 100%;
      background: var(--bg-soft);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 7px 10px;
      color: var(--text);
      font-family: var(--mono);
      font-size: 12px;
    }

    .field-input:focus {
      outline: none;
      border-color: var(--accent);
    }

    textarea.field-input {
      min-height: 80px;
      resize: vertical;
    }

    .kw-cell {
      cursor: pointer;
      min-width: 120px;
    }

    .kw-pills-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      min-height: 28px;
      padding: 2px 4px;
      border-radius: 6px;
      transition: background 0.15s;
    }

    .kw-cell:hover .kw-pills-wrap {
      background: var(--surface-2);
    }

    .kw-pill {
      font-family: var(--mono);
      font-size: 11px;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 4px 8px;
      color: var(--subtle);
      white-space: nowrap;
      background: var(--surface);
    }

    .kw-empty {
      color: var(--muted);
      font-size: 12px;
      font-style: italic;
    }

    .kw-input {
      display: none;
      width: 100%;
      min-width: 180px;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .toggle {
      position: relative;
      display: inline-block;
      width: 38px;
      height: 22px;
    }

    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      inset: 0;
      background: var(--muted);
      border-radius: 22px;
      cursor: pointer;
      transition: 0.2s;
    }

    .slider:before {
      content: "";
      position: absolute;
      height: 16px;
      width: 16px;
      left: 3px;
      bottom: 3px;
      background: var(--text);
      border-radius: 50%;
      transition: 0.2s;
    }

    input:checked+.slider {
      background: var(--accent);
    }

    input:checked+.slider:before {
      transform: translateX(16px);
    }

    .number-input {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .num-btn {
      background: var(--surface-2);
      border: none;
      color: var(--text);
      width: 26px;
      height: 26px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
    }

    /* Toast */
    #toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--green);
      color: #fff;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 13px;
      font-family: var(--mono);
      opacity: 0;
      transform: translateY(10px);
      transition: 0.3s;
      z-index: 99;
    }

    #toast.show {
      opacity: 1;
      transform: none;
    }

    /* Chat detail */
    .breadcrumb {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--muted);
      cursor: pointer;
      padding: 0;
      background: none;
      border: none;
    }

    .breadcrumb:hover {
      color: var(--text);
    }

    .msg-bubble {
      margin-bottom: 8px;
      padding: 11px 14px;
      border-radius: 16px;
      background: rgba(15, 19, 32, 0.9);
      border: 1px solid var(--border);
      font-family: var(--mono);
      font-size: 12px;
      max-width: 80%;
    }

    .msg-bubble.outgoing {
      background: linear-gradient(120deg,
          rgba(255, 79, 132, 0.16),
          rgba(255, 143, 63, 0.12));
      border-color: rgba(255, 143, 63, 0.26);
      margin-left: auto;
    }

    .msg-meta {
      font-size: 10px;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .msg-body {
      color: var(--text);
      word-break: break-word;
      white-space: pre-wrap;
    }

    .msg-list {
      display: flex;
      flex-direction: column;
    }

    /* Live-active mode (no fullscreen, just shrink content padding)  */
    body.live-active .content {
      padding: 0;
      overflow: hidden;
    }

    /* Instagram View */
    .live-root {
      display: flex;
      flex-direction: column;
      height: 100%;
      background: #000;
    }

    .live-shell {
      display: grid;
      grid-template-columns: 360px 1fr;
      flex: 1;
      overflow: hidden;
      background: #000;
    }

    /* Inbox pane */
    .live-inbox-pane {
      border-right: 1px solid #262626;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #000;
    }

    .live-inbox-header {
      padding: 14px 16px 10px;
      border-bottom: 1px solid #262626;
    }

    .live-inbox-username {
      font-size: 16px;
      font-weight: 700;
      color: #fff;
    }

    .live-inbox-sub {
      font-size: 12px;
      color: #a8a8a8;
      margin-top: 2px;
    }

    .live-inbox-list {
      flex: 1;
      overflow-y: auto;
      padding: 4px 0;
    }

    .live-chat-row {
      display: grid;
      grid-template-columns: 56px 1fr auto;
      gap: 0;
      align-items: center;
      padding: 8px 16px;
      cursor: pointer;
      transition: background 0.1s;
    }

    .live-chat-row:hover {
      background: #1a1a1a;
    }

    .live-chat-row.active {
      background: #1a1a1a;
    }

    .live-avatar {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      flex-shrink: 0;
      overflow: hidden;
      /* Instagram gradient avatar */
      background: linear-gradient(45deg,
          #f09433 0%,
          #e6683c 25%,
          #dc2743 50%,
          #cc2366 75%,
          #bc1888 100%);
    }

    .live-chat-info {
      padding: 0 12px;
      min-width: 0;
    }

    .live-chat-title {
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .live-chat-preview {
      margin-top: 3px;
      color: #a8a8a8;
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .live-chat-meta {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
      flex-shrink: 0;
    }

    .live-chat-time {
      font-size: 12px;
      color: #a8a8a8;
    }

    .live-unread {
      background: #0095f6;
      color: #fff;
      min-width: 20px;
      text-align: center;
      border-radius: 999px;
      padding: 2px 6px;
      font-size: 11px;
      font-weight: 700;
    }

    /* Thread pane */
    .live-thread-pane {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #000;
    }

    .live-thread-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      border-bottom: 1px solid #262626;
      flex-shrink: 0;
    }

    .live-thread-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(45deg,
          #f09433 0%,
          #e6683c 25%,
          #dc2743 50%,
          #cc2366 75%,
          #bc1888 100%);
      display: grid;
      place-items: center;
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      flex-shrink: 0;
      overflow: hidden;
    }

    .live-thread-name {
      font-size: 15px;
      font-weight: 700;
      color: #fff;
    }

    .live-thread-status {
      font-size: 12px;
      color: #a8a8a8;
    }

    .live-thread-back {
      display: none;
      border: none;
      background: none;
      color: #fff;
      border-radius: 999px;
      margin: 0 5px 0 8px;
      font-size: 30px;
      font-family: var(--mono);
      cursor: pointer;
    }

    /* Message list */
    .live-msg-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 8px 16px 16px;
      display: flex;
      flex-direction: column;
    }

    .live-scroll-spacer {
      flex: 1;
      min-height: 0;
    }

    .live-msg-group {
      display: flex;
      flex-direction: column;
      margin-bottom: 18px;
    }

    .live-msg-group.outgoing {
      align-items: flex-end;
    }

    .live-msg-group.incoming {
      align-items: flex-start;
    }

    /* sender name above first message of incoming group */
    .live-group-name {
      font-size: 11px;
      color: #a8a8a8;
      margin-bottom: 4px;
      margin-left: 44px;
    }

    /* row = avatar + bubble(s) column */
    .live-group-body {
      display: flex;
      align-items: flex-end;
      gap: 8px;
    }

    .live-group-body.outgoing {
      flex-direction: row-reverse;
    }

    .live-msg-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: linear-gradient(45deg,
          #f09433 0%,
          #e6683c 25%,
          #dc2743 50%,
          #cc2366 75%,
          #bc1888 100%);
      display: grid;
      place-items: center;
      font-size: 9px;
      font-weight: 700;
      color: #fff;
      flex-shrink: 0;
      align-self: flex-end;
      overflow: hidden;
    }

    .live-msg-avatar.hidden-avatar {
      visibility: hidden;
    }

    .live-bubbles {
      display: flex;
      flex-direction: column;
      gap: 2px;
      max-width: 550px;
      align-items: flex-start;
      min-width: 0;
    }

    .live-msg-group.outgoing .live-bubbles {
      align-items: flex-end;
    }

    /* Reply-to wrapper — contains the label + quote + actual bubble */
    .live-bubble-wrap {
      display: flex;
      flex-direction: column;
      gap: 2px;
      width: fit-content;
      max-width: 100%;
      align-items: flex-start;
    }

    .live-msg-group.outgoing .live-bubble-wrap {
      align-items: flex-end;
    }

    .live-reply-label {
      font-size: 11px;
      color: #a8a8a8;
      padding: 0 4px;
      max-width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin: 0px 8px 4px 8px;
    }

    .live-reply-quote {
      position: relative;
      font-size: 14px;
      line-height: 1.45;
      color: #B6B7B9;
      border-radius: 22px;
      padding: 9px 14px;
      margin-bottom: 5px;
      max-width: 500px;
      box-sizing: border-box;
      display: block;
      overflow: visible;
      margin-left: 16px;
    }

    .live-reply-quote::before {
      content: "";
      position: absolute;
      left: -10px;
      top: 4px;
      bottom: 4px;
      width: 4px;
      border-radius: 999px;
      background: rgba(122, 128, 138, 0.55);
    }

    .live-reply-quote-text {
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .live-msg-group.outgoing .live-reply-quote {
      margin-left: 0;
      margin-right: 16px;
    }

    .live-msg-group.outgoing .live-reply-quote::before {
      left: auto;
      right: -10px;
    }

    .live-reply-quote.source-incoming {
      background: #1D2026;
    }

    .live-reply-quote.source-incoming::before {
      background: rgba(115, 122, 133, 0.55);
    }

    .live-reply-quote.source-outgoing {
      background: #3745B5;
    }

    /* Instagram incoming bubble: dark charcoal */
    .live-bubble {
      padding: 9px 14px;
      border-radius: 22px;
      font-size: 14px;
      line-height: 1.45;
      word-break: break-word;
      white-space: pre-wrap;
      overflow-wrap: break-word;
      color: #fff;
      background: #25292E;
      max-width: 550px;
      width: fit-content;
      /* stacked bubble corners */
    }

    /* Incoming group corner logic: avatar sits at bottom-left of group */
    .live-bubble:not(.out).first {
      border-bottom-left-radius: 4px;
    }

    .live-bubble:not(.out).mid {
      border-top-left-radius: 4px;
      border-bottom-left-radius: 4px;
    }

    .live-bubble:not(.out).last {
      border-top-left-radius: 4px;
    }

    /* outgoing: Instagram blue */
    .live-bubble.out {
      background: #4A5DF9;
      color: #fff;
    }

    /* Outgoing group corner logic */
    .live-bubble.out.first {
      border-bottom-right-radius: 4px;
    }

    .live-bubble.out.mid {
      border-top-right-radius: 4px;
      border-bottom-right-radius: 4px;
    }

    .live-bubble.out.last {
      border-top-right-radius: 4px;
    }

    .live-bubble.deleted {
      background: transparent;
      border: 1px solid #333;
      color: #666;
      font-style: italic;
    }

    /* Activity pills */
    .live-activity {
      border-top: 1px solid #1a1a1a;
      padding: 6px 16px;
      display: flex;
      gap: 6px;
      flex-wrap: nowrap;
      overflow-x: auto;
      background: #000;
      flex-shrink: 0;
    }

    .live-pill {
      font-size: 10px;
      font-family: var(--mono);
      border: 1px solid #333;
      color: #555;
      border-radius: 999px;
      padding: 2px 7px;
      white-space: nowrap;
      background: transparent;
      flex-shrink: 0;
    }

    @media (max-width: 980px) {
      aside {
        width: 76px;
      }

      .topbar {
        height: auto;
        padding: 10px 12px;
        flex-wrap: nowrap;
        gap: 8px;
      }

      .topbar h1 {
        flex: 1;
        font-size: 16px;
      }

      .topbar input {
        width: 160px;
        font-size: 11px;
        flex-shrink: 0;
      }

      .content {
        padding: 14px;
      }

      .stats-grid {
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 10px;
      }

      .stat-card {
        padding: 14px 14px;
      }

      .stat-card .val {
        font-size: 22px;
      }

      .config-editor {
        flex-direction: column;
        gap: 12px;
      }

      .config-nav {
        width: 100%;
        display: flex;
        gap: 6px;
        overflow-x: auto;
      }

      .config-nav-item {
        margin-bottom: 0;
        white-space: nowrap;
        flex-shrink: 0;
      }

      .fields-grid {
        grid-template-columns: 1fr;
      }

      .field-card[style*="grid-column:span 2"] {
        grid-column: span 1 !important;
      }

      .live-msg-scroll {
        padding: 8px 12px 12px;
      }

      .live-bubbles,
      .live-bubble,
      .live-reply-quote {
        max-width: min(100%, 430px);
      }

      .sidebar-logo {
        font-size: 14px;
        padding: 14px 10px;
        text-align: center;
      }

      .sidebar-logo span,
      .conn-badge,
      .conn-badge span,
      .sidebar-footer {
        display: none;
      }

      .nav-item {
        justify-content: center;
        padding: 11px 8px;
      }

      .nav-item .icon {
        margin-right: 0;
      }

      .nav-item:not(.active) {
        color: var(--text);
      }

      .nav-item> :not(.icon) {
        display: none;
      }

      .live-shell {
        grid-template-columns: 1fr;
      }

      .live-thread-back {
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .live-inbox-pane {
        border-right: none;
        border-bottom: 1px solid #262626;
      }
    }

    @media (max-width: 640px) {
      body {
        flex-direction: column;
        height: 100dvh;
        overflow: hidden;
      }

      aside {
        width: 100%;
        height: 66px;
        order: 2;
        border-right: none;
        border-top: 1px solid var(--border);
        background: rgba(10, 13, 24, 0.98);
        overflow: hidden;
      }

      main {
        order: 1;
        min-height: 0;
      }

      .sidebar-logo,
      .conn-badge,
      .sidebar-footer {
        display: none;
      }

      nav {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        height: 100%;
        overflow-x: auto;
        overflow-y: hidden;
        padding: 6px 6px;
      }

      .nav-item {
        margin: 0;
        border-radius: 10px;
        min-width: 52px;
        max-width: 52px;
        height: 52px;
        padding: 8px 6px;
        justify-content: center;
        flex-shrink: 0;
      }

      .nav-item .icon svg {
        width: 17px;
        height: 17px;
      }

      .nav-item> :not(.icon) {
        display: none;
      }

      .nav-badge {
        position: absolute;
        top: 3px;
        right: 3px;
        min-width: 16px;
        font-size: 9px;
        padding: 1px 4px;
      }

      .topbar {
        padding: 10px;
      }

      .topbar h1 {
        font-size: 15px;
      }

      .topbar input {
        display: none !important;
      }

      .btn {
        padding: 7px 12px;
        font-size: 11px;
      }

      .content {
        padding: 10px;
      }

      .card-header {
        padding: 12px 14px;
        font-size: 11px;
      }

      th,
      td {
        padding: 9px 10px;
      }

      .live-chat-row {
        grid-template-columns: 48px 1fr auto;
        padding: 8px 10px;
      }

      .live-avatar {
        width: 46px;
        height: 46px;
        font-size: 12px;
      }

      .live-thread-header {
        padding: 9px 10px;
      }

      .live-thread-avatar {
        width: 38px;
        height: 38px;
      }

      .live-thread-name {
        font-size: 14px;
      }

      .live-msg-group {
        margin-bottom: 12px;
      }

      .live-bubbles,
      .live-bubble,
      .live-reply-quote {
        max-width: 100%;
      }

      .live-bubble,
      .live-reply-quote {
        font-size: 13px;
      }

      .live-reply-quote-text {
        white-space: normal;
        overflow: visible;
        text-overflow: clip;
      }

      .live-activity {
        padding: 6px 10px;
      }
    }

    @media (max-width: 420px) {
      aside {
        height: 62px;
      }

      .nav-item {
        flex-direction: column;
        min-width: 48px;
        max-width: 48px;
        height: 48px;
      }

      .content {
        padding: 8px;
      }

      .stats-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>
  <!-- Sidebar -->
  <aside>
    <div class="sidebar-logo">AUROIC<span>control panel</span></div>
    <div class="conn-badge">
      <div class="conn-dot" id="connDot"></div>
      <span id="connStatus">Connecting…</span>
    </div>
    <nav id="nav">
      <div class="nav-item active" data-view="overview">
        <i data-lucide="layout-dashboard" class="icon"></i><span>Overview</span>
      </div>
      <div class="nav-item" data-view="live">
        <i data-lucide="instagram" class="icon"></i><span>Instagram</span>
        <span class="nav-badge" id="badge-live">0</span>
      </div>
      <div class="nav-item" data-view="conversations">
        <i data-lucide="message-square" class="icon"></i><span>Chats</span>
        <span class="nav-badge" id="badge-conversations">0</span>
      </div>
      <div class="nav-item" data-view="messages">
        <i data-lucide="mail" class="icon"></i><span>Messages</span>
        <span class="nav-badge" id="badge-messages">0</span>
      </div>
      <div class="nav-item" data-view="users">
        <i data-lucide="users" class="icon"></i><span>Users</span>
        <span class="nav-badge" id="badge-users">0</span>
      </div>
      <div class="nav-item" data-view="media">
        <i data-lucide="image" class="icon"></i><span>Media</span>
        <span class="nav-badge" id="badge-media">0</span>
      </div>
      <div class="nav-item" data-view="reactions">
        <i data-lucide="heart" class="icon"></i><span>Reactions</span>
        <span class="nav-badge" id="badge-reactions">0</span>
      </div>
      <div class="nav-item" data-view="outgoing">
        <i data-lucide="send" class="icon"></i><span>Outgoing</span>
        <span class="nav-badge" id="badge-outgoing">0</span>
      </div>
      <div class="nav-item" data-view="router">
        <i data-lucide="git-branch" class="icon"></i><span>Router</span>
      </div>
      <div class="nav-item" data-view="commands">
        <i data-lucide="terminal" class="icon"></i><span>Commands</span>
        <span class="nav-badge" id="badge-commands">0</span>
      </div>
      <div class="nav-item" data-view="config">
        <i data-lucide="settings" class="icon"></i><span>Config</span>
      </div>
    </nav>
    <div class="sidebar-footer" id="sidebarTime"></div>
  </aside>

  <!-- Main -->
  <main>
    <div class="topbar">
      <h1 id="viewTitle">Overview</h1>
      <input type="text" id="searchInput" placeholder="Search…" oninput="handleSearch(this.value)" />
      <button class="btn secondary" onclick="refreshAll()">↻ Refresh</button>
    </div>
    <div class="content" id="content"></div>
  </main>

  <div id="toast"></div>

  <script>
    // State
    const state = {
      view: "overview",
      conversations: [],
      messages: [],
      users: [],
      media: [],
      reactions: [],
      outgoing: [],
      commands: [],
      commandRegistry: [],
      ttsOptions: null,
      config: null,
      configDirty: false,
      routerFeed: [], // live router decisions / events
      chatDetailId: null,
      chatMessages: [],
      liveSelectedChatId: null,
      liveMessages: [],
      liveUnreadByChat: {},
      liveActivity: [],
      liveBackTo: null,
      liveCompactThreadOpen: false,
      search: "",
      counts: {
        conversations: 0,
        messages: 0,
        users: 0,
        media: 0,
        reactions: 0,
        outgoing: 0,
        commands: 0,
        live: 0,
      },
      newBadges: { messages: false },
    };

    // Routing
    function setView(v) {
      state.view = v;
      state.chatDetailId = null;
      state.search = "";
      document.getElementById("searchInput").value = "";
      document.querySelectorAll(".nav-item").forEach((el) => {
        el.classList.toggle("active", el.dataset.view === v);
      });
      // live-active mode: remove content padding
      const isLive = v === "live";
      document.body.classList.toggle("live-active", isLive);
      const titles = {
        overview: "Overview",
        conversations: "Chats",
        messages: "Messages",
        users: "Users",
        media: "Media",
        reactions: "Reactions",
        outgoing: "Outgoing",
        commands: "Commands",
        live: "Instagram",
        router: "Router Feed",
        config: "Runtime Config",
      };
      if (v === "live") {
        if (isCompactLiveLayout()) {
          state.liveCompactThreadOpen = false;
        }
        ensureLiveSelection();
      }
      document.getElementById("viewTitle").textContent = titles[v] || v;
      updateTopbarForCurrentView();
      renderView();
    }

    document.getElementById("nav").addEventListener("click", (e) => {
      const item = e.target.closest(".nav-item");
      if (item?.dataset.view) {
        const v = item.dataset.view;
        if (v === state.view) return;
        // clear new badge for this view
        const badge = document.getElementById("badge-" + v);
        if (badge) badge.classList.remove("new");
        setView(v);
      }
    });

    // Data fetching
    async function fetchJSON(url) {
      try {
        const r = await fetch(url);
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        return await r.json();
      } catch (e) {
        console.warn("Fetch failed:", url, e.message);
        return null;
      }
    }

    async function refreshAll() {
      const [conversations, messages, users, media, reactions, outgoing, commands, commandRegistry, cfg, ttsOptions] =
        await Promise.all([
          fetchJSON("/api/conversations"),
          fetchJSON("/api/messages?limit=200"),
          fetchJSON("/api/users"),
          fetchJSON("/api/media?limit=100"),
          fetchJSON("/api/reactions?limit=200"),
          fetchJSON("/api/outgoing?limit=200"),
          fetchJSON("/api/commands"),
          fetchJSON("/api/commands/registry"),
          fetchJSON("/config"),
          fetchJSON("/api/tts/options"),
        ]);
      if (conversations) state.conversations = conversations;
      if (messages) state.messages = messages;
      if (users) state.users = users;
      if (media) state.media = media;
      if (reactions) state.reactions = reactions;
      if (outgoing) state.outgoing = outgoing;
      if (commands) state.commands = commands;
      if (commandRegistry) state.commandRegistry = commandRegistry;
      if (cfg && !state.configDirty) state.config = cfg;
      if (ttsOptions) state.ttsOptions = ttsOptions;

      state.counts = {
        conversations: state.conversations.length,
        messages: state.messages.length,
        users: state.users.length,
        media: state.media.length,
        reactions: state.reactions.length,
        outgoing: state.outgoing.length,
        commands: state.commands.length,
        live: Object.values(state.liveUnreadByChat).reduce(
          (a, b) => a + b,
          0,
        ),
      };
      updateBadges();
      // Don't wipe the config editor on unrelated data refreshes.
      if (state.view !== "config") renderView();
    }

    async function loadConfig() {
      const cfg = await fetchJSON("/config");
      if (cfg) {
        state.config = cfg;
        state.configDirty = false;
      }
    }

    function updateBadges() {
      [
        "conversations",
        "messages",
        "users",
        "media",
        "reactions",
        "outgoing",
        "commands",
      ].forEach((k) => {
        const el = document.getElementById("badge-" + k);
        if (el) el.textContent = state.counts[k];
      });

      const liveUnread = Object.values(state.liveUnreadByChat).reduce(
        (a, b) => a + b,
        0,
      );
      const liveBadge = document.getElementById("badge-live");
      if (liveBadge) {
        liveBadge.textContent = String(liveUnread);
        liveBadge.classList.toggle("new", liveUnread > 0);
      }
    }

    // SS
    function connectSSE() {
      const es = new EventSource("/events");
      const dot = document.getElementById("connDot");
      const st = document.getElementById("connStatus");

      es.onopen = () => {
        dot.classList.add("live");
        st.textContent = "Live";
      };
      es.onerror = () => {
        dot.classList.remove("live");
        st.textContent = "Reconnecting…";
      };

      es.onmessage = (e) => {
        const ev = JSON.parse(e.data);
        handleSSEEvent(ev);
      };
    }

    function handleSSEEvent(ev) {
      const now = new Date().toLocaleTimeString();
      if (ev.chatId && ev.chatId !== state.liveSelectedChatId) {
        state.liveUnreadByChat[ev.chatId] =
          (state.liveUnreadByChat[ev.chatId] || 0) + 1;
      }
      appendLiveActivity(ev, now);
      updateBadges();

      switch (ev.type) {
        case "NEW_MESSAGE":
          refreshAll().then(() => refreshLiveSelection(ev.chatId));
          if (state.view !== "messages") {
            const b = document.getElementById("badge-messages");
            if (b) b.classList.add("new");
          }
          appendFeed({
            text: `NEW_MESSAGE  chat:${shortId(ev.chatId)}  mid:${shortId(ev.mid)}`,
            time: now,
          });
          break;

        case "EDIT":
          refreshAll().then(() => refreshLiveSelection(ev.chatId));
          appendFeed({
            text: `EDIT  chat:${shortId(ev.chatId)}  mid:${shortId(ev.mid)}`,
            time: now,
          });
          break;

        case "DELETE":
          refreshAll().then(() => refreshLiveSelection(ev.chatId));
          appendFeed({
            text: `DELETE  chat:${shortId(ev.chatId)}  mid:${shortId(ev.mid)}`,
            time: now,
          });
          break;

        case "REACTION_ADD":
          refreshAll().then(() => refreshLiveSelection(ev.chatId));
          appendFeed({
            text: `REACTION+  chat:${shortId(ev.chatId)}  ${ev.reaction}`,
            time: now,
          });
          break;

        case "REACTION_REMOVE":
          refreshAll().then(() => refreshLiveSelection(ev.chatId));
          appendFeed({
            text: `REACTION-  chat:${shortId(ev.chatId)}`,
            time: now,
          });
          break;

        case "ROUTER_DECISION":
          appendFeed({
            text: `ROUTER  chat:${shortId(ev.chatId)}  type:${ev.decision.type}  effort:${ev.decision.effort}  title:${ev.decision.title}`,
            time: now,
          });
          if (state.view === "router") renderView();
          break;

        case "OUTGOING":
          refreshAll().then(() => refreshLiveSelection(ev.chatId));
          appendFeed({
            text: `OUTGOING  chat:${shortId(ev.chatId)}  ${ev.actionType}`,
            time: now,
          });
          break;

        case "CONFIG_CHANGED":
          if (state.configDirty) {
            // Don't clobber in-progress edits. Just warn.
            showToast("Config changed in DB — you have unsaved edits");
          } else {
            loadConfig().then(() => {
              if (state.view === "config") renderView();
              showToast("Config reloaded from DB");
            });
          }
          break;
      }
    }

    function appendFeed(item) {
      state.routerFeed.unshift(item);
      if (state.routerFeed.length > 200) state.routerFeed.pop();
      if (state.view === "router") renderView();
    }

    function appendLiveActivity(ev, now) {
      if (!ev.type || !ev.chatId) return;
      const note =
        `${ev.type} ${shortId(ev.chatId)} ${ev.mid ? shortId(ev.mid) : ""}`.trim();
      state.liveActivity.unshift({
        text: note,
        time: now,
        chatId: ev.chatId,
      });
      if (state.liveActivity.length > 36) state.liveActivity.pop();
      if (state.view === "live") renderView();
    }

    function refreshLiveSelection(chatId) {
      if (!state.liveSelectedChatId) return;
      if (chatId && chatId !== state.liveSelectedChatId) return;
      setLiveChat(state.liveSelectedChatId, true);
    }

    function shortId(id) {
      return id ? String(id).slice(-8) : "?";
    }

    // Rendering
    function renderView() {
      const el = document.getElementById("content");
      switch (state.view) {
        case "overview":
          el.innerHTML = renderOverview();
          break;
        case "conversations":
          el.innerHTML = state.chatDetailId
            ? renderChatDetail()
            : renderChats();
          break;
        case "messages":
          el.innerHTML = renderMessages();
          break;
        case "users":
          el.innerHTML = renderUsers();
          break;
        case "media":
          el.innerHTML = renderMedia();
          break;
        case "reactions":
          el.innerHTML = renderReactions();
          break;
        case "outgoing":
          el.innerHTML = renderOutgoing();
          break;
        case "live":
          el.innerHTML = renderLive();
          break;
        case "router":
          el.innerHTML = renderRouter();
          break;
        case "commands":
          renderCommandsView(el);
          return;
        case "config":
          renderConfigView(el);
          return;
        default:
          el.innerHTML = '<div class="empty">Select a view</div>';
      }
      // Attach delegates
      el.querySelectorAll("[data-chat-click]").forEach((r) =>
        r.addEventListener("click", () =>
          openChatDetail(r.dataset.chatClick),
        ),
      );
      el.querySelectorAll("[data-live-chat-click]").forEach((r) =>
        r.addEventListener("click", () =>
          setLiveChat(r.dataset.liveChatClick),
        ),
      );
      // scroll live chat to bottom after render
      const scroll = document.getElementById("liveMsgScroll");
      if (scroll) scroll.scrollTop = scroll.scrollHeight;
      updateTopbarForCurrentView();
    }

    function isCompactLiveLayout() {
      return window.matchMedia("(max-width: 980px)").matches;
    }

    function updateTopbarForCurrentView() {
      const searchInput = document.getElementById("searchInput");
      if (!searchInput) return;
      // Only toggle hidden class on desktop; mobile uses CSS display: none
      const isDesktop = window.matchMedia("(min-width: 981px)").matches;
      if (!isDesktop) return;
      const hideForLiveThread =
        state.view === "live" &&
        state.liveCompactThreadOpen;
      searchInput.classList.toggle("hidden", hideForLiveThread);
    }

    function renderOverview() {
      const c = state.counts;
      return `
    <div class="stats-grid">
      <div class="stat-card"><div class="val">${c.conversations}</div><div class="lbl">Chats</div></div>
      <div class="stat-card"><div class="val">${c.messages}</div><div class="lbl">Messages</div></div>
      <div class="stat-card"><div class="val">${c.users}</div><div class="lbl">Users</div></div>
      <div class="stat-card"><div class="val">${c.media}</div><div class="lbl">Media items</div></div>
      <div class="stat-card"><div class="val">${c.reactions}</div><div class="lbl">Reactions</div></div>
      <div class="stat-card"><div class="val">${c.outgoing}</div><div class="lbl">Outgoing actions</div></div>
    </div>
    <div class="card">
      <div class="card-header">Recent Events (live)</div>
      <div style="padding:14px">
        ${state.routerFeed.length === 0
          ? '<div class="empty" style="padding:20px">No events yet — events appear here in real time</div>'
          : state.routerFeed
            .slice(0, 20)
            .map(
              (f) =>
                `<div class="feed-item"><span class="feed-time">${esc(f.time)}</span>${esc(f.text)}</div>`,
            )
            .join("")
        }
      </div>
    </div>`;
    }

    function renderChats() {
      const rows = state.conversations.filter(
        (c) =>

    }

    function buildLiveSummaries() {
      const recentByChat = new Map();
      for (const m of state.messages) {
        const prev = recentByChat.get(m.conversationId);
        if (!prev || m.timestampMs > prev.timestampMs) {
          recentByChat.set(m.conversationId, m);
        }
      }

      return state.conversations
        .map((c) => {
          const recent = recentByChat.get(c.conversationId);
          const botId = state.config?.instagram?.fbId;
          // Avatar: prefer stored avatarUrl; for personal chats fall back to the other user's avatar
          let avatarUrl = c.avatarUrl || null;
          if (!avatarUrl && !c.isGroup) {
            const otherMsg = state.messages.find(
              (m) =>
                m.conversationId === c.conversationId && m.userId !== botId,
            );
            if (otherMsg) {
              const otherUser = state.users.find(
                (u) => u.userId === otherMsg.userId,
              );
              avatarUrl = otherUser?.avatarUrl || null;
            }
          }
          return {
            id: c.conversationId,
            title: c.title || `Chat ${shortId(c.conversationId)}`,
            preview: recent?.textContent || "No recent text",
            at: recent?.timestampMs || 0,
            unread: state.liveUnreadByChat[c.conversationId] || 0,
            avatarUrl,
          };
        })
        .filter(
          (c) =>
            !state.search ||
            c.title.toLowerCase().includes(state.search) ||
            c.id.includes(state.search) ||
            c.preview.toLowerCase().includes(state.search),
        )
        .sort((a, b) => b.at - a.at);
    }

    function buildMessageGroups(messages, botId) {
      // Group consecutive messages from the same sender
      const sorted = messages
        .slice()
        .sort((a, b) => a.timestampMs - b.timestampMs);
      const groups = [];
      for (const m of sorted) {
        const last = groups[groups.length - 1];
        // Break group if this message is a reply (always starts its own visual group)
        if (last && last.userId === m.userId && !m.replyToMessageId) {
          last.messages.push(m);
        } else {
          // resolve display name from users list
          const userObj = state.users.find((u) => u.userId === m.userId);
          const displayName =
            userObj?.displayName || userObj?.username || shortId(m.userId);
          const avatarUrl = userObj?.avatarUrl || null;
          groups.push({
            userId: m.userId,
            displayName,
            avatarUrl,
            messages: [m],
          });
        }
      }
      return groups;
    }

    function renderMessageGroups(groups, botId) {
      if (!groups.length)
        return '<div style="color:#a8a8a8;text-align:center;padding:40px 0;font-size:14px">No messages yet</div>';
      // Build a mid → message lookup for reply-to resolution
      const msgById = new Map();
      for (const g of groups)
        for (const m of g.messages)
          msgById.set(m.messageId, {
            m,
            userId: g.userId,
            displayName: g.displayName,
          });

      return groups
        .map((g) => {
          const isOut = g.userId === botId;
          const count = g.messages.length;
          const bubblesHtml = g.messages
            .map((m, i) => {
              let pos = "solo";
              if (count > 1) {
                if (i === 0) pos = "first";
                else if (i === count - 1) pos = "last";
                else pos = "mid";
              }
              const deletedClass = m.isDeleted ? " deleted" : "";
              const editedMark = m.isEdited
                ? ' <span style="font-size:10px;opacity:.55">(edited)</span>'
                : "";
              const text = m.isDeleted
                ? "Message deleted"
                : esc(m.textContent || "[no text]");
              const bubble = `<div class="live-bubble ${pos}${isOut ? " out" : ""}${deletedClass}">${text}${editedMark}</div>`;

              // Reply-to decoration
              if (m.replyToMessageId) {
                const replied = msgById.get(m.replyToMessageId);
                const repliedToBot = replied
                  ? replied.userId === botId
                  : false;
                let labelName;
                if (repliedToBot) {
                  labelName = "you";
                } else if (replied) {
                  const ru = state.users.find(
                    (u) => u.userId === replied.userId,
                  );
                  labelName =
                    ru?.displayName ||
                    ru?.username ||
                    replied.displayName ||
                    shortId(replied.userId);
                } else {
                  labelName = null;
                }
                const senderName = isOut ? "You" : esc(g.displayName);
                const label = labelName
                  ? `<div class="live-reply-label">${senderName} replied to ${esc(labelName)}</div>`
                  : "";
                const quoteText = replied
                  ? esc(replied.m.textContent || "[media]")
                  : "[original message]";
                const quoteTone = repliedToBot
                  ? "source-outgoing"
                  : "source-incoming";
                const quote = `<div class="live-reply-quote ${quoteTone}"><span class="live-reply-quote-text">${quoteText}</span></div>`;
                return `<div class="live-bubble-wrap">${label}${quote}${bubble}</div>`;
              }

              return bubble;
            })
            .join("");

          if (isOut) {
            return `<div class="live-msg-group outgoing">
  <div class="live-group-body outgoing">
    <div class="live-bubbles">${bubblesHtml}</div>
  </div>
</div>`;
          }

          // Incoming: name above group, avatar only on last (bottom-most) message
          const isReplyGroup = !!g.messages[0]?.replyToMessageId;
          const nameRow = isReplyGroup
            ? ""
            : `<div class="live-group-name">${esc(g.displayName)}</div>`;
          const avatarHtml = g.avatarUrl
            ? `<img src="${esc(g.avatarUrl)}" style="width:100%;height:100%;object-fit:cover">`
            : esc(initials(g.displayName));
          return `<div class="live-msg-group incoming">
  ${nameRow}
  <div class="live-group-body">
    <div class="live-msg-avatar">${avatarHtml}</div>
    <div class="live-bubbles">${bubblesHtml}</div>
  </div>
</div>`;
        })
        .join("");
    }

    function renderLive() {
      const chats = buildLiveSummaries();
      const selected = state.liveSelectedChatId;
      const compactLive = isCompactLiveLayout();
      const showInboxPane = !compactLive || !state.liveCompactThreadOpen;
      const showThreadPane = !compactLive || state.liveCompactThreadOpen;
      const selectedChat = state.conversations.find(
        (c) => c.conversationId === selected,
      );
      const selectedTitle =
        selectedChat?.title ||
        chats.find((c) => c.id === selected)?.title ||
        "Direct Messages";
      const botId = state.config?.instagram?.fbId;
      const groups = selected
        ? buildMessageGroups(state.liveMessages, botId)
        : [];
      const botUser = state.users.find((u) => u.userId === botId);
      const botName = botUser?.username
        ? `@${botUser.username}`
        : botUser?.displayName || "@bot";

      return `<div class="live-root">
  <div class="live-shell">
    <!-- Inbox -->
    ${showInboxPane
          ? `
    <div class="live-inbox-pane">
      <div class="live-inbox-header">
        <div class="live-inbox-username">${esc(botName)}</div>
        <div class="live-inbox-sub">Inbox · ${chats.length} conversation${chats.length !== 1 ? "s" : ""}</div>
      </div>
      <div class="live-inbox-list">
        ${chats.length === 0
            ? '<div style="color:#a8a8a8;text-align:center;padding:32px 16px;font-size:14px">No conversations</div>'
            : chats
              .map(
                (
                  c,
                ) => `<div class="live-chat-row${c.id === selected ? " active" : ""}" data-live-chat-click="${esc(c.id)}">
            <div class="live-avatar">${c.avatarUrl ? `<img src="${esc(c.avatarUrl)}" style="width:100%;height:100%;object-fit:cover">` : esc(initials(c.title))}</div>
            <div class="live-chat-info">
              <div class="live-chat-title">${esc(c.title)}</div>
              <div class="live-chat-preview">${esc(c.preview)}</div>
            </div>
            <div class="live-chat-meta">
              <div class="live-chat-time">${c.at ? formatTime(c.at) : ""}</div>
              ${c.unread ? `<div class="live-unread">${c.unread}</div>` : ""}
            </div>
          </div>`,
              )
              .join("")
          }
      </div>
    </div>
    `
          : ""
        }

    <!-- Thread -->
    ${showThreadPane
          ? `
    <div class="live-thread-pane">
      ${!selected
            ? '<div style="color:#a8a8a8;text-align:center;padding:80px 24px;font-size:14px">Select a conversation</div>'
            : `<div class="live-thread-header">
          ${compactLive ? '<button class="live-thread-back" onclick="openLiveInbox()">&lsaquo;</button>' : ''}
          <div class="live-thread-avatar">${selectedChat?.avatarUrl ? `<img src="${esc(selectedChat.avatarUrl)}" style="width:100%;height:100%;object-fit:cover">` : esc(initials(selectedTitle))}</div>
          <div>
            <div class="live-thread-name">${esc(selectedTitle)}</div>
            <div class="live-thread-status">Instagram · read only</div>
          </div>
        </div>
        <div class="live-msg-scroll" id="liveMsgScroll">
          <div class="live-scroll-spacer"></div>
          ${renderMessageGroups(groups, botId)}
        </div>
        <div class="live-activity">
          ${state.liveActivity.length === 0
              ? '<span class="live-pill">no events yet</span>'
              : state.liveActivity
                .slice(0, 12)
                .map(
                  (a) =>
                    `<span class="live-pill">${esc(a.time)} ${esc(a.text)}</span>`,
                )
                .join("")
            }
        </div>`
          }
    </div>
    `
          : ""
        }
  </div>
</div>`;
    }

    function openLiveInbox() {
      state.liveCompactThreadOpen = false;
      if (state.view === "live") renderView();
    }

    function exitLive() {
      const dest = state.liveBackTo || "conversations";
      state.liveBackTo = null;
      setView(dest);
    }

    function initials(name) {
      const parts = String(name || "IG")
        .trim()
        .split(/\s+/)
        .slice(0, 2);
      return parts.map((p) => p[0]?.toUpperCase() || "").join("") || "IG";
    }

    function formatTime(ts) {
      return new Date(ts).toLocaleTimeString([], {
        hour: "2-digit",
        minute: "2-digit",
      });
    }

    function ensureLiveSelection() {
      if (state.liveSelectedChatId) return;
      const first = state.conversations[0]?.conversationId;
      if (first) setLiveChat(first);
    }

    function setLiveChat(chatId, silentRender = false) {
      if (!chatId) return;
      state.liveSelectedChatId = chatId;
      if (isCompactLiveLayout()) state.liveCompactThreadOpen = true;
      state.liveUnreadByChat[chatId] = 0;
      updateBadges();
      fetchJSON(`/api/conversations/${chatId}/messages?limit=200`).then(
        (msgs) => {
          state.liveMessages = msgs || [];
          if (state.view === "live" || !silentRender) renderView();
        },
      );
    }

    window.addEventListener("resize", () => {
      if (state.view !== "live") {
        updateTopbarForCurrentView();
        return;
      }
      renderView();
    });

    // Commands management

    function renderCommandsView(el) {
      const rows = (state.commands || []).map((row) => ({
        command: row.command,
        aliases: Array.isArray(row.aliases) ? row.aliases : [],
        isEnabled: Boolean(row.isEnabled),
        handlerName: row.handlerName || "",
        filterKeywords: Array.isArray(row.filterKeywords) ? row.filterKeywords : [],
      }));

      const filteredRows = rows.filter((row) => {
        if (!state.search) return true;
        const hay = `${row.command} ${row.aliases.join(",")} ${row.filterKeywords.join(",")}`.toLowerCase();
        return hay.includes(state.search.toLowerCase());
      });

      const makePills = (items, prefix) =>
        items.length === 0
          ? `<span class="kw-empty">—</span>`
          : items.map((v) => `<span class="kw-pill">${prefix}${esc(v)}</span>`).join("");

      el.innerHTML = `
        <div style="margin-bottom:18px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap">
          <div>
            <h2 style="margin:0 0 8px 0">Commands (${rows.length})</h2>
            <p style="color:var(--subtle);margin:0">Edit aliases, enabled state, and filter keywords. Command and handler are read-only.</p>
          </div>
          <button class="btn" id="cmd-save">Save</button>
        </div>
        <div class="card">
          ${filteredRows.length === 0 ? '<div class="empty">No commands found</div>' : `
            <table>
              <thead>
                <tr>
                  <th>Command</th>
                  <th>Aliases</th>
                  <th style="text-align:center">Enabled</th>
                  <th>Handler</th>
                  <th>Filter Keywords</th>
                </tr>
              </thead>
              <tbody>
                ${filteredRows.map((row) => `
                  <tr data-command-row="${esc(row.command)}">
                    <td style="font-weight:600;font-family:var(--mono);font-size:13px;white-space:nowrap">${esc(row.command)}</td>
                    <td class="kw-cell">
                      <div class="kw-pills-wrap">${makePills(row.aliases, "/")}</div>
                      <input data-aliases type="text" class="field-input kw-input" value="${esc(row.aliases.join(", "))}" />
                    </td>
                    <td style="text-align:center">
                      <label class="toggle">
                        <input data-enabled type="checkbox" ${row.isEnabled ? "checked" : ""} />
                        <span class="slider"></span>
                      </label>
                    </td>
                    <td style="font-family:var(--mono);font-size:12px;color:var(--subtle);white-space:nowrap">${esc(row.handlerName)}</td>
                    <td class="kw-cell">
                      <div class="kw-pills-wrap">${makePills(row.filterKeywords, "")}</div>
                      <input data-filter-keywords type="text" class="field-input kw-input" value="${esc(row.filterKeywords.join(", "))}" />
                    </td>
                  </tr>
                `).join("")}
              </tbody>
            </table>
          `}
        </div>
      `;

      // Click-to-edit for kw-cells
      el.querySelectorAll(".kw-cell").forEach((cell) => {
        const pillsWrap = cell.querySelector(".kw-pills-wrap");
        const input = cell.querySelector(".kw-input");

        cell.addEventListener("click", () => {
          if (input.style.display === "block") return;
          pillsWrap.style.display = "none";
          input.style.display = "block";
          input.focus();
        });

        const commitEdit = () => {
          const isAliases = input.hasAttribute("data-aliases");
          const prefix = isAliases ? "/" : "";
          const vals = input.value.split(",").map((v) => v.trim().toLowerCase()).filter(Boolean);
          pillsWrap.innerHTML = makePills(vals, prefix);
          input.style.display = "none";
          pillsWrap.style.display = "";
        };

        input.addEventListener("blur", commitEdit);
        input.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === "Escape") input.blur();
        });
      });

      el.querySelector("#cmd-save")?.addEventListener("click", async () => {
        const payloadRows = [...el.querySelectorAll("[data-command-row]")].map((rowEl) => {
          const command = rowEl.dataset.commandRow;
          const aliasesInput = rowEl.querySelector("[data-aliases]");
          const enabledInput = rowEl.querySelector("[data-enabled]");
          const filterKeywordsInput = rowEl.querySelector("[data-filter-keywords]");

          const existing = rows.find((row) => row.command === command);

          return {
            command,
            aliases: (aliasesInput?.value || "")
              .split(",")
              .map((v) => v.trim().toLowerCase())
              .filter(Boolean),
            isEnabled: Boolean(enabledInput?.checked),
            handlerName: existing?.handlerName || "",
            filterKeywords: (filterKeywordsInput?.value || "")
              .split(",")
              .map((v) => v.trim().toLowerCase())
              .filter(Boolean),
          };
        });

        try {
          const res = await fetch("/api/commands/save", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ commands: payloadRows }),
          });
          const payload = await res.json();
          if (!res.ok) throw new Error(payload.error || `HTTP ${res.status}`);
          const latest = await fetchJSON("/api/commands");
          if (latest) state.commands = latest;
          showToast("Commands saved");
          renderCommandsView(el);
        } catch (err) {
          showToast("Save failed: " + err.message);
        }
      });
    }

    // Config editor
    let configLocal = null;
    let configSection = null;

    function renderConfigView(el) {
      if (!state.config) {
        el.innerHTML = '<div class="empty">Loading config…</div>';
        loadConfig().then(() => renderView());
        return;
      }
      configLocal = JSON.parse(JSON.stringify(state.config));
      const sections = Object.keys(configLocal);
      if (!configSection || !sections.includes(configSection))
        configSection = sections[0];

      el.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <div style="font-size:13px;color:var(--subtle)">Edit <code style="color:var(--accent)">config.db/settings</code> — changes apply after save</div>
      <div style="display:flex;gap:8px">
        <button class="btn secondary" onclick="loadConfig().then(()=>renderView())">↻ Reload</button>
        <button class="btn" onclick="saveConfig()">Save</button>
      </div>
    </div>
    <div class="config-editor">
      <div class="config-nav">
        ${sections
          .map(
            (s) => `
          <div class="config-nav-item${s === configSection ? " active" : ""}" onclick="configSection='${s}';renderView()">
            ${s}
          </div>`,
          )
          .join("")}
      </div>
      <div class="config-body">
        <div class="fields-grid">
          ${renderConfigSection(configLocal[configSection], configSection)}
        </div>
      </div>
    </div>`;
    }

    function renderConfigSection(obj, prefix) {
      if (typeof obj !== "object" || obj === null) return "";
      return Object.entries(obj)
        .map(([key, val]) => {
          const path = prefix + "." + key;
          const label = key;
          const selectOptions = getConfigStringOptions(path);
          if (typeof val === "boolean") {
            return `<div class="field-card">
        <div class="field-label">${esc(label)}</div>
        <div class="toggle-row">
          <span style="font-family:var(--mono);font-size:12px;color:var(--subtle)">${val}</span>
          <label class="toggle">
            <input type="checkbox" ${val ? "checked" : ""} onchange="updateConfig('${esc(path)}', this.checked)">
            <span class="slider"></span>
          </label>
        </div>
      </div>`;
          }
          if (typeof val === "number") {
            const isFloat = val % 1 !== 0;
            const step = isFloat ? 0.1 : 1;
            const decimals = isFloat ? 4 : 0;
            return `<div class="field-card">
        <div class="field-label">${esc(label)}</div>
        <div class="number-input">
          <button class="num-btn" onclick="adjustConfigNumber('${esc(path)}', this, -${step}, ${decimals})">−</button>
          <input class="field-input" type="number" value="${val}" step="${step}" style="width:80px;text-align:center"
            onchange="updateConfig('${esc(path)}', +this.value)">
          <button class="num-btn" onclick="adjustConfigNumber('${esc(path)}', this, ${step}, ${decimals})">+</button>
        </div>
      </div>`;
          }
          if (
            typeof val === "string" &&
            Array.isArray(selectOptions) &&
            selectOptions.length > 0
          ) {
            return `<div class="field-card">
        <div class="field-label">${esc(label)}</div>
        <select class="field-input" onchange="updateConfig('${esc(path)}', this.value)">
          ${selectOptions
                .map(
                  (opt) =>
                    `<option value="${esc(opt)}" ${opt === val ? "selected" : ""}>${esc(opt)}</option>`,
                )
                .join("")}
        </select>
      </div>`;
          }
          if (typeof val === "string" && val.length > 60) {
            return `<div class="field-card" style="grid-column:span 2">
        <div class="field-label">${esc(label)}</div>
        <textarea class="field-input" rows="4"
          onchange="updateConfig('${esc(path)}', this.value)"
          oninput="updateConfig('${esc(path)}', this.value)">${esc(val)}</textarea>
      </div>`;
          }
          if (Array.isArray(val)) {
            return `<div class="field-card">
        <div class="field-label">${esc(label)} <span style="color:var(--muted)">(comma-sep)</span></div>
        <input class="field-input" type="text" value="${esc(val.join(", "))}"
          onchange="updateConfig('${esc(path)}', this.value.split(',').map(s=>s.trim()).filter(Boolean))">
      </div>`;
          }
          if (typeof val === "object" && val !== null) {
            return `<div class="field-card" style="grid-column:span 2">
        <div class="field-label" style="font-size:12px;color:var(--text);border-bottom:1px solid var(--border);padding-bottom:8px;margin-bottom:12px;text-transform:uppercase;letter-spacing:0.06em">${esc(label)}</div>
        <div class="fields-grid">
          ${renderConfigSection(val, path)}
        </div>
      </div>`;
          }
          return `<div class="field-card">
      <div class="field-label">${esc(label)}</div>
      <input class="field-input" type="text" value="${esc(String(val ?? ""))}"
        onchange="updateConfig('${esc(path)}', this.value)">
    </div>`;
        })
        .join("");
    }

    function getConfigStringOptions(path) {
      if (!state.ttsOptions || typeof state.ttsOptions !== "object") return null;

      if (path === "tts.voice" && Array.isArray(state.ttsOptions.voices)) {
        return state.ttsOptions.voices;
      }

      if (path === "tts.dtype" && Array.isArray(state.ttsOptions.dtypes)) {
        return state.ttsOptions.dtypes;
      }

      return null;
    }

    function updateConfig(path, value) {
      const parts = path.split(".");
      let cur = configLocal;
      for (let i = 0; i < parts.length - 1; i++) {
        cur = cur[parts[i]];
        if (!cur) return;
      }
      cur[parts[parts.length - 1]] = value;
      state.configDirty = true;
    }

    function adjustConfigNumber(path, buttonEl, delta, decimals) {
      const input = delta < 0
        ? buttonEl.nextElementSibling
        : buttonEl.previousElementSibling;

      if (!input) return;

      const base = Number(input.value);
      const safeBase = Number.isFinite(base) ? base : 0;
      const next = Number((safeBase + Number(delta)).toFixed(Number(decimals)));

      input.value = String(next);
      updateConfig(path, next);
    }

    async function saveConfig() {
      try {
        const r = await fetch("/config", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(configLocal, null, 2),
        });
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        state.config = JSON.parse(JSON.stringify(configLocal));
        state.configDirty = false;
        showToast("Config saved");
      } catch (e) {
        showToast("Save failed: " + e.message);
      }
    }

    // Search
    function handleSearch(q) {
      state.search = q.toLowerCase();
      renderView();
    }

    // Utilities
    function esc(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function showToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 2500);
    }

    // Clock
    function updateClock() {
      const el = document.getElementById("sidebarTime");
      if (el) el.textContent = new Date().toLocaleTimeString();
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Ini
    (async function init() {
      connectSSE();
      await Promise.all([refreshAll(), loadConfig()]);
      lucide.createIcons();
      renderView();
    })();
  </script>
</body>

</html>
