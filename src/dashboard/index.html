<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Auroic Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Sora:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://unpkg.com/lucide@v0/dist/umd/lucide.min.js"></script>
    <style>
      :root {
        --bg: #313338;
        --bg-soft: #2b2d31;
        --surface: #1e1f22;
        --surface-2: #35373c;
        --border: #3f4147;
        --muted: #949ba4;
        --text: #f2f3f5;
        --subtle: #949ba4;
        --accent: #5865f2;
        --accent-2: #4752c4;
        --green: #23a55a;
        --red: #f23f43;
        --yellow: #f0b232;
        --mono: "JetBrains Mono", monospace;
        --sans: "Sora", sans-serif;
        --sidebar-w: 248px;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        scrollbar-width: none;
      }

      *::-webkit-scrollbar {
        display: none;
      }

      body {
        font-family: var(--sans);
        background: var(--bg);
        color: var(--text);
        display: flex;
        height: 100vh;
        min-height: 100dvh;
        overflow: hidden;
      }

      /* Sidebar */
      aside {
        width: var(--sidebar-w);
        flex-shrink: 0;
        background: var(--bg-soft);
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        overflow-y: auto;
      }

      .sidebar-logo {
        padding: 20px 22px 15px;
        font-size: 19px;
        font-weight: 700;
        letter-spacing: 0.02em;
        color: #fff;
        border-bottom: 1px solid var(--border);
        position: sticky;
        top: 0;
        z-index: 10;
        background: var(--bg-soft);
      }

      .sidebar-logo span {
        color: var(--subtle);
        font-size: 11px;
        display: block;
        margin-top: 5px;
      }

      .conn-badge {
        display: none;
      }

      .conn-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--muted);
      }

      .conn-dot.live {
        background: var(--green);
        box-shadow: 0 0 4px var(--green);
      }

      nav {
        flex: 1;
        padding: 12px 8px;
      }

      .nav-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin: 0 6px 4px;
        border-radius: 12px;
        padding: 10px 14px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 500;
        color: var(--subtle);
        transition:
          background 0.1s,
          color 0.1s;
        gap: 8px;
      }

      .nav-item:hover {
        background: rgba(255, 255, 255, 0.06);
        color: var(--text);
      }

      .nav-item.active {
        background: linear-gradient(
          90deg,
          rgba(255, 79, 132, 0.2),
          rgba(255, 143, 63, 0.12)
        );
        color: #fff;
        box-shadow: inset 0 0 0 1px rgba(255, 143, 63, 0.25);
      }

      .nav-item .icon {
        min-width: 18px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .nav-item .icon svg {
        width: 16px;
        height: 16px;
        stroke-width: 1.75;
      }

      .nav-badge {
        background: var(--accent);
        color: #fff;
        font-size: 10px;
        font-family: var(--mono);
        border-radius: 9px;
        padding: 1px 6px;
        min-width: 20px;
        text-align: center;
      }

      .nav-badge.new {
        background: var(--green);
        animation: pulse 0.8s ease-in-out infinite alternate;
      }

      @keyframes pulse {
        from {
          opacity: 1;
        }

        to {
          opacity: 0.5;
        }
      }

      .sidebar-footer {
        padding: 16px 22px;
        border-top: 1px solid var(--border);
        font-size: 11px;
        color: var(--muted);
        font-family: var(--mono);
      }

      /* Main */
      main {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
        overflow: hidden;
      }

      .topbar {
        height: 60px;
        background: var(--bg);
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        padding: 0 20px;
        gap: 12px;
        flex-shrink: 0;
      }

      .topbar h1 {
        font-size: 17px;
        font-weight: 700;
        flex: 1;
      }

      .topbar input {
        background: var(--bg-soft);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 9px 14px;
        color: var(--text);
        font-size: 12px;
        width: 240px;
        font-family: var(--mono);
      }

      .topbar input:focus {
        outline: none;
        border-color: var(--accent);
      }

      .btn {
        background: var(--accent);
        color: #fff;
        border: none;
        border-radius: 999px;
        padding: 8px 15px;
        font-size: 12px;
        cursor: pointer;
        font-family: var(--sans);
        font-weight: 600;
      }

      .btn:hover {
        opacity: 0.85;
      }

      .btn.secondary {
        background: rgba(255, 255, 255, 0.07);
        color: var(--text);
      }

      .power-wrap {
        position: relative;
      }

      .power-btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }

      .power-icon {
        width: 14px;
        height: 14px;
      }

      .power-btn.paused {
        border: 1px solid rgba(255, 192, 98, 0.4);
        color: var(--yellow);
      }

      .power-btn.restarting {
        border: 1px solid rgba(255, 94, 109, 0.45);
        color: var(--red);
      }

      .power-menu {
        position: absolute;
        top: calc(100% + 8px);
        right: 0;
        min-width: 190px;
        background: rgba(18, 24, 42, 0.98);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 6px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        z-index: 40;
        box-shadow: 0 14px 30px rgba(0, 0, 0, 0.35);
      }

      .power-item {
        background: transparent;
        border: none;
        border-radius: 9px;
        color: var(--text);
        font-family: var(--sans);
        font-size: 12px;
        text-align: left;
        padding: 9px 10px;
        cursor: pointer;
      }

      .power-item:hover {
        background: rgba(255, 255, 255, 0.07);
      }

      .power-item.danger {
        color: var(--red);
      }

      .power-item:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .otp-panel {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 8px;
        border-radius: 999px;
        background: rgba(18, 24, 42, 0.95);
        border: 1px solid rgba(255, 143, 63, 0.45);
        box-shadow: inset 0 0 0 1px rgba(255, 79, 132, 0.15);
      }

      .otp-label {
        font-size: 11px;
        color: var(--yellow);
        font-family: var(--mono);
        white-space: nowrap;
      }

      .otp-input {
        width: 130px;
        background: var(--bg-soft);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 7px 10px;
        color: var(--text);
        font-size: 12px;
        font-family: var(--mono);
      }

      .otp-input:focus {
        outline: none;
        border-color: var(--yellow);
      }

      .otp-submit {
        border: none;
        border-radius: 999px;
        background: var(--accent);
        color: #fff;
        font-size: 11px;
        font-family: var(--mono);
        padding: 7px 12px;
        cursor: pointer;
      }

      .otp-submit:disabled {
        opacity: 0.7;
        cursor: not-allowed;
      }

      .content {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
        min-width: 0;
      }

      /* Cards / tables */
      .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 14px;
        margin-bottom: 24px;
      }

      .stat-card {
        background: rgba(18, 24, 42, 0.9);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 18px 20px;
      }

      .stat-card .val {
        font-family: var(--mono);
        font-size: 26px;
        font-weight: 500;
        color: var(--accent);
      }

      .stat-card .lbl {
        font-size: 12px;
        color: var(--subtle);
        margin-top: 4px;
      }

      .card {
        background: rgba(18, 24, 42, 0.9);
        border: 1px solid var(--border);
        border-radius: 16px;
        overflow-x: auto;
        overflow-y: hidden;
        margin-bottom: 20px;
      }

      .card-header {
        padding: 14px 18px;
        border-bottom: 1px solid var(--border);
        font-size: 12px;
        font-weight: 600;
        color: var(--text);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }

      th {
        padding: 10px 16px;
        text-align: left;
        font-family: var(--mono);
        font-size: 10px;
        color: var(--muted);
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        border-bottom: 1px solid var(--border);
      }

      td {
        padding: 10px 16px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        color: var(--text);
        font-family: var(--mono);
        font-size: 12px;
        vertical-align: top;
        max-width: 300px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      tr:last-child td {
        border-bottom: none;
      }

      tr:hover td {
        background: rgba(255, 255, 255, 0.03);
      }

      .tag {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 4px;
        font-size: 11px;
        font-family: var(--mono);
      }

      .tag.text {
        background: rgba(124, 111, 255, 0.15);
        color: var(--accent);
      }

      .tag.ignore {
        background: rgba(64, 64, 79, 0.4);
        color: var(--subtle);
      }

      .tag.react {
        background: rgba(224, 176, 85, 0.15);
        color: var(--yellow);
      }

      .tag.ack {
        background: rgba(76, 175, 138, 0.15);
        color: var(--green);
      }

      .tag.media {
        background: rgba(224, 85, 85, 0.15);
        color: var(--red);
      }

      .empty {
        padding: 40px;
        text-align: center;
        color: var(--muted);
        font-size: 13px;
        font-family: var(--mono);
      }

      /* Live feed */
      .live-feed {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .feed-item {
        background: rgba(18, 24, 42, 0.94);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px 14px;
        font-family: var(--mono);
        font-size: 12px;
        animation: slideIn 0.25s ease-out;
      }

      .feed-item .feed-time {
        color: var(--muted);
        font-size: 10px;
        float: right;
      }

      .feed-item .feed-type {
        color: var(--accent);
        margin-right: 8px;
      }

      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateY(-6px);
        }

        to {
          opacity: 1;
          transform: none;
        }
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* Config editor */
      .config-editor {
        display: flex;
        gap: 20px;
      }

      .config-nav {
        width: 180px;
        flex-shrink: 0;
      }

      .config-nav-item {
        padding: 8px 12px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 13px;
        color: var(--subtle);
        transition:
          background 0.1s,
          color 0.1s;
        margin-bottom: 2px;
      }

      .config-nav-item:hover {
        background: rgba(255, 255, 255, 0.04);
        color: var(--text);
      }

      .config-nav-item.active {
        background: rgba(88, 101, 242, 0.15);
        color: #fff;
      }

      .config-body {
        flex: 1;
      }

      .fields-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      .field-card {
        background: rgba(18, 24, 42, 0.8);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 14px 16px;
        transition: border-color 0.15s;
      }

      .field-card.modified {
        border-color: var(--yellow);
      }

      .field-label {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--subtle);
        margin-bottom: 8px;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--yellow);
      }

      .field-input {
        width: 100%;
        background: var(--bg-soft);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 7px 10px;
        color: var(--text);
        font-family: var(--mono);
        font-size: 12px;
      }

      .field-input:focus {
        outline: none;
        border-color: var(--accent);
      }

      textarea.field-input {
        min-height: 80px;
        resize: vertical;
      }

      .kw-cell {
        cursor: pointer;
        min-width: 120px;
      }

      .kw-pills-wrap {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        min-height: 28px;
        padding: 2px 4px;
        border-radius: 6px;
        transition: background 0.15s;
      }

      .kw-cell:hover .kw-pills-wrap {
        background: var(--surface-2);
      }

      .kw-pill {
        font-family: var(--mono);
        font-size: 11px;
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 4px 8px;
        color: var(--subtle);
        white-space: nowrap;
        background: var(--surface);
      }

      .kw-empty {
        color: var(--muted);
        font-size: 12px;
        font-style: italic;
      }

      .kw-input {
        display: none;
        width: 100%;
        min-width: 180px;
      }

      .toggle-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .toggle {
        position: relative;
        display: inline-block;
        width: 38px;
        height: 22px;
      }

      .toggle input {
        opacity: 0;
        width: 0;
        height: 0;
      }

      .slider {
        position: absolute;
        inset: 0;
        background: var(--muted);
        border-radius: 22px;
        cursor: pointer;
        transition: 0.2s;
      }

      .slider:before {
        content: "";
        position: absolute;
        height: 16px;
        width: 16px;
        left: 3px;
        bottom: 3px;
        background: var(--text);
        border-radius: 50%;
        transition: 0.2s;
      }

      input:checked + .slider {
        background: var(--accent);
      }

      input:checked + .slider:before {
        transform: translateX(16px);
      }

      .number-input {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .num-btn {
        background: var(--surface-2);
        border: none;
        color: var(--text);
        width: 26px;
        height: 26px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 16px;
        line-height: 1;
      }

      /* Toast */
      #toast {
        position: fixed;
        bottom: 24px;
        right: 24px;
        background: var(--green);
        color: #fff;
        padding: 10px 20px;
        border-radius: 8px;
        font-size: 13px;
        font-family: var(--mono);
        opacity: 0;
        transform: translateY(10px);
        transition: 0.3s;
        z-index: 99;
        pointer-events: none;
      }

      #toast.show {
        opacity: 1;
        transform: none;
      }

      /* Chat detail */
      .breadcrumb {
        font-family: var(--mono);
        font-size: 12px;
        color: var(--muted);
        cursor: pointer;
        padding: 0;
        background: none;
        border: none;
      }

      .breadcrumb:hover {
        color: var(--text);
      }

      .msg-bubble {
        margin-bottom: 8px;
        padding: 11px 14px;
        border-radius: 16px;
        background: rgba(15, 19, 32, 0.9);
        border: 1px solid var(--border);
        font-family: var(--mono);
        font-size: 12px;
        max-width: 80%;
      }

      .msg-bubble.outgoing {
        background: rgba(88, 101, 242, 0.15);
        border-color: rgba(88, 101, 242, 0.3);
        margin-left: auto;
      }

      .msg-meta {
        font-size: 10px;
        color: var(--muted);
        margin-bottom: 4px;
      }

      .msg-body {
        color: var(--text);
        word-break: break-word;
        white-space: pre-wrap;
      }

      .msg-list {
        display: flex;
        flex-direction: column;
      }

      body.live-active .content {
        padding: 0;
        overflow: hidden;
      }

      /* Discord View */
      .live-root {
        display: flex;
        flex-direction: column;
        height: 100%;
        background: var(--bg);
      }

      .live-shell {
        display: grid;
        grid-template-columns: 360px 1fr;
        flex: 1;
        overflow: hidden;
        background: var(--bg);
      }

      .live-inbox-pane {
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        background: var(--bg-soft);
      }

      .live-inbox-header {
        padding: 14px 16px 10px;
        border-bottom: 1px solid var(--border);
      }

      .live-inbox-username {
        font-size: 16px;
        font-weight: 700;
        color: #fff;
      }

      .live-inbox-sub {
        font-size: 12px;
        color: #a8a8a8;
        margin-top: 2px;
      }

      .live-inbox-list {
        flex: 1;
        overflow-y: auto;
        padding: 4px 0;
      }

      .live-chat-row {
        display: grid;
        grid-template-columns: 56px 1fr auto;
        gap: 0;
        align-items: center;
        padding: 8px 16px;
        cursor: pointer;
        transition: background 0.1s;
      }

      .live-chat-row:hover {
        background: var(--surface-2);
      }

      .live-chat-row.active {
        background: var(--surface);
      }

      .live-avatar {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-size: 15px;
        font-weight: 700;
        color: #fff;
        flex-shrink: 0;
        overflow: hidden;
        background: var(--accent);
      }

      .live-chat-info {
        padding: 0 12px;
        min-width: 0;
      }

      .live-chat-title {
        font-size: 14px;
        font-weight: 600;
        color: #fff;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .live-chat-preview {
        margin-top: 3px;
        color: #a8a8a8;
        font-size: 13px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .live-chat-meta {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 6px;
        flex-shrink: 0;
      }

      .live-chat-time {
        font-size: 12px;
        color: #a8a8a8;
      }

      .live-unread {
        background: var(--red);
        color: #fff;
        min-width: 20px;
        text-align: center;
        border-radius: 999px;
        padding: 2px 6px;
        font-size: 11px;
        font-weight: 700;
      }

      .live-thread-pane {
        display: flex;
        flex-direction: column;
        overflow: hidden;
        background: var(--bg);
      }

      .live-thread-header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 16px;
        border-bottom: 1px solid var(--border);
        flex-shrink: 0;
      }

      .live-thread-avatar {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: var(--accent);
        display: grid;
        place-items: center;
        font-size: 13px;
        font-weight: 700;
        color: #fff;
        flex-shrink: 0;
        overflow: hidden;
      }

      .live-thread-name {
        font-size: 15px;
        font-weight: 700;
        color: #fff;
      }

      .live-thread-status {
        font-size: 12px;
        color: #a8a8a8;
      }

      .live-thread-back {
        display: none;
        border: none;
        background: none;
        color: #fff;
        border-radius: 999px;
        margin: 0 5px 0 8px;
        font-size: 30px;
        font-family: var(--mono);
        cursor: pointer;
      }

      .live-msg-scroll {
        flex: 1;
        overflow-y: auto;
        padding: 8px 16px 16px;
        display: flex;
        flex-direction: column;
      }

      .live-scroll-spacer {
        flex: 1;
        min-height: 0;
      }

      .live-msg-group {
        display: flex;
        flex-direction: column;
        margin-bottom: 18px;
      }

      .live-msg-group.outgoing {
        align-items: flex-end;
      }

      .live-msg-group.incoming {
        align-items: flex-start;
      }

      .live-group-name {
        font-size: 11px;
        color: #a8a8a8;
        margin-bottom: 4px;
        margin-left: 44px;
      }

      .live-group-body {
        display: flex;
        align-items: flex-end;
        gap: 8px;
      }

      .live-group-body.outgoing {
        flex-direction: row-reverse;
      }

      .live-msg-avatar {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: var(--accent);
        display: grid;
        place-items: center;
        font-size: 9px;
        font-weight: 700;
        color: #fff;
        flex-shrink: 0;
        align-self: flex-end;
        overflow: hidden;
      }

      .live-msg-avatar.hidden-avatar {
        visibility: hidden;
      }

      .live-bubbles {
        display: flex;
        flex-direction: column;
        gap: 2px;
        max-width: 550px;
        align-items: flex-start;
        min-width: 0;
      }

      .live-msg-group.outgoing .live-bubbles {
        align-items: flex-end;
      }

      .live-bubble-wrap {
        display: flex;
        flex-direction: column;
        gap: 2px;
        width: fit-content;
        max-width: 100%;
        align-items: flex-start;
      }

      .live-msg-group.outgoing .live-bubble-wrap {
        align-items: flex-end;
      }

      .live-reply-label {
        font-size: 11px;
        color: #a8a8a8;
        padding: 0 4px;
        max-width: 100%;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        margin: 0 8px 4px 8px;
      }

      .live-reply-quote {
        position: relative;
        font-size: 14px;
        line-height: 1.45;
        color: #b6b7b9;
        border-radius: 22px;
        padding: 9px 14px;
        margin-bottom: 5px;
        max-width: 500px;
        box-sizing: border-box;
        display: block;
        overflow: visible;
        margin-left: 16px;
      }

      .live-reply-quote::before {
        content: "";
        position: absolute;
        left: -10px;
        top: 4px;
        bottom: 4px;
        width: 4px;
        border-radius: 999px;
        background: rgba(122, 128, 138, 0.55);
      }

      .live-reply-quote-text {
        display: block;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .live-msg-group.outgoing .live-reply-quote {
        margin-left: 0;
        margin-right: 16px;
      }

      .live-msg-group.outgoing .live-reply-quote::before {
        left: auto;
        right: -10px;
      }

      .live-reply-quote.source-incoming {
        background: var(--surface);
      }

      .live-reply-quote.source-incoming::before {
        background: rgba(115, 122, 133, 0.55);
      }

      .live-reply-quote.source-outgoing {
        background: rgba(88, 101, 242, 0.2);
      }

      .live-bubble {
        padding: 9px 14px;
        border-radius: 22px;
        font-size: 14px;
        line-height: 1.45;
        word-break: break-word;
        white-space: pre-wrap;
        overflow-wrap: break-word;
        color: #fff;
        background: var(--surface-2);
        max-width: 550px;
        width: fit-content;
      }

      .live-bubble:not(.out).first {
        border-bottom-left-radius: 4px;
      }

      .live-bubble:not(.out).mid {
        border-top-left-radius: 4px;
        border-bottom-left-radius: 4px;
      }

      .live-bubble:not(.out).last {
        border-top-left-radius: 4px;
      }

      .live-bubble.out {
        background: var(--accent);
        color: #fff;
      }

      .live-bubble.out.first {
        border-bottom-right-radius: 4px;
      }

      .live-bubble.out.mid {
        border-top-right-radius: 4px;
        border-bottom-right-radius: 4px;
      }

      .live-bubble.out.last {
        border-top-right-radius: 4px;
      }

      .live-bubble.deleted {
        background: transparent;
        border: 1px solid #333;
        color: #666;
        font-style: italic;
      }

      .live-media-stack {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .live-media-card {
        position: relative;
        border-radius: 16px;
        overflow: hidden;
        background: transparent;
        max-width: min(220px, 100%);
      }

      .live-media-thumb {
        display: block;
        width: 100%;
        max-height: 180px;
        object-fit: cover;
        background: #111;
      }

      .live-media-open {
        position: absolute;
        top: 8px;
        right: 8px;
        border: none;
        border-radius: 999px;
        padding: 4px 9px;
        font-size: 10px;
        font-family: var(--mono);
        text-transform: uppercase;
        letter-spacing: 0.04em;
        background: rgba(0, 0, 0, 0.6);
        color: #fff;
        text-decoration: none;
        line-height: 1;
      }

      .live-media-fallback {
        padding: 8px 10px;
        color: #cbd4ec;
        font-size: 11px;
        font-family: var(--mono);
      }

      .live-activity {
        border-top: 1px solid var(--border);
        padding: 6px 16px;
        display: flex;
        gap: 6px;
        flex-wrap: nowrap;
        overflow-x: auto;
        background: var(--bg);
        flex-shrink: 0;
      }

      .live-command-bar {
        border-top: 1px solid var(--border);
        padding: 10px 12px;
        display: flex;
        align-items: center;
        gap: 8px;
        background: var(--bg);
        flex-shrink: 0;
      }

      .live-command-input {
        flex: 1;
        min-width: 0;
        background: var(--surface);
        border: 1px solid var(--border);
        color: #fff;
        border-radius: 999px;
        padding: 10px 14px;
        font-size: 13px;
        font-family: var(--mono);
      }

      .live-command-input:focus {
        outline: none;
        border-color: var(--accent);
      }

      .live-command-send {
        border: 1px solid var(--accent);
        color: #fff;
        background: var(--accent);
        border-radius: 999px;
        padding: 9px 14px;
        font-size: 12px;
        font-family: var(--mono);
        cursor: pointer;
        flex-shrink: 0;
      }

      .live-command-send:disabled {
        opacity: 0.65;
        cursor: not-allowed;
      }

      .live-command-status {
        font-size: 11px;
        color: #8f94a2;
        font-family: var(--mono);
        min-height: 14px;
        padding: 0 14px 8px;
        background: var(--bg);
        flex-shrink: 0;
      }

      .live-pill {
        font-size: 10px;
        font-family: var(--mono);
        border: 1px solid #333;
        color: #555;
        border-radius: 999px;
        padding: 2px 7px;
        white-space: nowrap;
        background: transparent;
        flex-shrink: 0;
      }

      /* Shell */
      .shell-root {
        display: flex;
        flex-direction: column;
        height: 100%;
        background: #0d1117;
        border-radius: 12px;
        overflow: hidden;
        border: 1px solid #21262d;
      }

      body.shell-active .content {
        padding: 0;
        overflow: hidden;
      }

      .shell-toolbar {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 16px;
        background: #161b22;
        border-bottom: 1px solid #21262d;
        flex-shrink: 0;
      }

      .shell-dots {
        display: flex;
        gap: 6px;
      }

      .shell-dots span {
        width: 12px;
        height: 12px;
        border-radius: 50%;
      }

      .shell-dots span:nth-child(1) {
        background: #ff5f57;
      }

      .shell-dots span:nth-child(2) {
        background: #febc2e;
      }

      .shell-dots span:nth-child(3) {
        background: #28c840;
      }

      .shell-title {
        flex: 1;
        text-align: center;
        font-family: var(--mono);
        font-size: 12px;
        color: #8b949e;
      }

      .shell-btn {
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid #30363d;
        color: #8b949e;
        border-radius: 6px;
        padding: 4px 10px;
        font-size: 11px;
        font-family: var(--mono);
        cursor: pointer;
        transition: all 0.15s;
      }

      .shell-btn:hover {
        background: rgba(255, 255, 255, 0.1);
        color: #c9d1d9;
      }

      .shell-btn.danger {
        border-color: rgba(255, 94, 109, 0.3);
        color: var(--red);
      }

      .shell-btn.danger:hover {
        background: rgba(255, 94, 109, 0.15);
      }

      .shell-output {
        flex: 1;
        overflow-y: auto;
        padding: 16px;
        font-family: var(--mono);
        font-size: 13px;
        line-height: 1.6;
        color: #c9d1d9;
        white-space: pre-wrap;
        word-break: break-all;
        scrollbar-width: thin;
        scrollbar-color: #30363d transparent;
      }

      .shell-output::-webkit-scrollbar {
        display: block;
        width: 6px;
      }

      .shell-output::-webkit-scrollbar-thumb {
        background: #30363d;
        border-radius: 3px;
      }

      .shell-line {
        margin: 0;
      }

      .shell-line-prompt {
        color: #7ee787;
      }

      .shell-line-cmd {
        color: #f0f6fc;
        font-weight: 500;
      }

      .shell-line-stdout {
        color: #c9d1d9;
      }

      .shell-line-stderr {
        color: #ff7b72;
      }

      .shell-input-area {
        display: flex;
        align-items: center;
        padding: 10px 16px;
        background: #0d1117;
        border-top: 1px solid #21262d;
        gap: 0;
        flex-shrink: 0;
      }

      .shell-prompt-text {
        font-family: var(--mono);
        font-size: 13px;
        color: #7ee787;
        white-space: nowrap;
        flex-shrink: 0;
        user-select: none;
      }

      .shell-input {
        flex: 1;
        background: transparent;
        border: none;
        color: #f0f6fc;
        font-family: var(--mono);
        font-size: 13px;
        outline: none;
        caret-color: #58a6ff;
        margin-left: 4px;
      }

      .shell-input::placeholder {
        color: #484f58;
      }

      .shell-input.password-mode {
        -webkit-text-security: disc;
      }

      .shell-status-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 4px 16px;
        background: #161b22;
        border-top: 1px solid #21262d;
        font-family: var(--mono);
        font-size: 10px;
        color: #484f58;
        flex-shrink: 0;
        gap: 12px;
      }

      .shell-status-indicator {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .shell-status-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #484f58;
      }

      .shell-status-dot.running {
        background: #ffa657;
        box-shadow: 0 0 6px rgba(255, 166, 87, 0.5);
        animation: pulse 1s ease-in-out infinite alternate;
      }

      .shell-status-dot.idle {
        background: #7ee787;
      }

      /* ANSI colors */
      .ansi-black {
        color: #484f58;
      }

      .ansi-red {
        color: #ff7b72;
      }

      .ansi-green {
        color: #7ee787;
      }

      .ansi-yellow {
        color: #ffa657;
      }

      .ansi-blue {
        color: #79c0ff;
      }

      .ansi-magenta {
        color: #d2a8ff;
      }

      .ansi-cyan {
        color: #a5d6ff;
      }

      .ansi-white {
        color: #c9d1d9;
      }

      .ansi-bright-black {
        color: #6e7681;
      }

      .ansi-bright-red {
        color: #ffa198;
      }

      .ansi-bright-green {
        color: #7ee787;
      }

      .ansi-bright-yellow {
        color: #ffa657;
      }

      .ansi-bright-blue {
        color: #a5d6ff;
      }

      .ansi-bright-magenta {
        color: #d2a8ff;
      }

      .ansi-bright-cyan {
        color: #a5d6ff;
      }

      .ansi-bright-white {
        color: #f0f6fc;
      }

      .ansi-bold {
        font-weight: 700;
      }

      .ansi-dim {
        opacity: 0.7;
      }

      .ansi-italic {
        font-style: italic;
      }

      .ansi-underline {
        text-decoration: underline;
      }

      /* Responsive */
      @media (max-width: 980px) {
        aside {
          width: 76px;
        }

        .topbar {
          height: auto;
          padding: 10px 12px;
          flex-wrap: nowrap;
          gap: 8px;
        }

        .topbar h1 {
          flex: 1;
          font-size: 16px;
        }

        .topbar input {
          width: 160px;
          font-size: 11px;
          flex-shrink: 0;
        }

        .content {
          padding: 14px;
        }

        .stats-grid {
          grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
          gap: 10px;
        }

        .stat-card {
          padding: 14px;
        }

        .stat-card .val {
          font-size: 22px;
        }

        .config-editor {
          flex-direction: column;
          gap: 12px;
        }

        .config-nav {
          width: 100%;
          display: flex;
          gap: 6px;
          overflow-x: auto;
        }

        .config-nav-item {
          margin-bottom: 0;
          white-space: nowrap;
          flex-shrink: 0;
        }

        .fields-grid {
          grid-template-columns: 1fr;
        }

        .field-card[style*="grid-column:span 2"] {
          grid-column: span 1 !important;
        }

        .live-msg-scroll {
          padding: 8px 12px 12px;
        }

        .live-bubbles,
        .live-bubble,
        .live-reply-quote {
          max-width: min(100%, 430px);
        }

        .sidebar-logo {
          font-size: 14px;
          padding: 14px 10px;
          text-align: center;
        }

        .sidebar-logo span,
        .conn-badge,
        .conn-badge span,
        .sidebar-footer {
          display: none;
        }

        .nav-item {
          justify-content: center;
          padding: 11px 8px;
        }

        .nav-item .icon {
          margin-right: 0;
        }

        .nav-item:not(.active) {
          color: var(--text);
        }

        .nav-item > :not(.icon) {
          display: none;
        }

        .live-shell {
          grid-template-columns: 1fr;
        }

        .live-thread-back {
          display: inline-flex;
          align-items: center;
          justify-content: center;
        }

        .live-inbox-pane {
          border-right: none;
          border-bottom: 1px solid #262626;
        }
      }

      @media (max-width: 640px) {
        body {
          flex-direction: column;
          height: 100dvh;
          overflow: hidden;
        }

        aside {
          width: 100%;
          height: 66px;
          order: 2;
          border-right: none;
          border-top: 1px solid var(--border);
          background: rgba(10, 13, 24, 0.98);
          overflow: hidden;
        }

        main {
          order: 1;
          min-height: 0;
        }

        .sidebar-logo,
        .conn-badge,
        .sidebar-footer {
          display: none;
        }

        nav {
          display: flex;
          align-items: center;
          gap: 8px;
          width: 100%;
          height: 100%;
          overflow-x: auto;
          overflow-y: hidden;
          padding: 6px;
        }

        .nav-item {
          margin: 0;
          border-radius: 10px;
          min-width: 52px;
          max-width: 52px;
          height: 52px;
          padding: 8px 6px;
          justify-content: center;
          flex-shrink: 0;
        }

        .nav-item .icon svg {
          width: 17px;
          height: 17px;
        }

        .nav-item > :not(.icon) {
          display: none;
        }

        .nav-badge {
          position: absolute;
          top: 3px;
          right: 3px;
          min-width: 16px;
          font-size: 9px;
          padding: 1px 4px;
        }

        .topbar {
          padding: 10px;
        }

        .topbar h1 {
          font-size: 15px;
        }

        .topbar input {
          display: none !important;
        }

        .btn {
          padding: 7px 12px;
          font-size: 11px;
        }

        .otp-panel {
          max-width: 100%;
        }

        .otp-input {
          width: 110px;
        }

        .content {
          padding: 10px;
        }

        .card-header {
          padding: 12px 14px;
          font-size: 11px;
        }

        th,
        td {
          padding: 9px 10px;
        }

        .live-chat-row {
          grid-template-columns: 48px 1fr auto;
          padding: 8px 10px;
        }

        .live-avatar {
          width: 46px;
          height: 46px;
          font-size: 12px;
        }

        .live-thread-header {
          padding: 9px 10px;
        }

        .live-thread-avatar {
          width: 38px;
          height: 38px;
        }

        .live-thread-name {
          font-size: 14px;
        }

        .live-msg-group {
          margin-bottom: 12px;
        }

        .live-bubbles,
        .live-bubble,
        .live-reply-quote {
          max-width: 100%;
        }

        .live-bubble,
        .live-reply-quote {
          font-size: 13px;
        }

        .live-reply-quote-text {
          white-space: normal;
          overflow: visible;
          text-overflow: clip;
        }

        .live-activity {
          padding: 6px 10px;
        }

        .live-command-bar {
          padding: 8px 10px;
        }

        .live-command-input {
          padding: 9px 12px;
          font-size: 12px;
        }

        .live-command-send {
          padding: 8px 12px;
        }

        .live-command-status {
          padding: 0 12px 8px;
        }
      }

      @media (max-width: 420px) {
        aside {
          height: 62px;
        }

        .nav-item {
          flex-direction: column;
          min-width: 48px;
          max-width: 48px;
          height: 48px;
        }

        .content {
          padding: 8px;
        }

        .stats-grid {
          grid-template-columns: 1fr 1fr;
        }
      }

      .hidden {
        display: none !important;
      }
    </style>
  </head>

  <body>
    <aside>
      <div class="sidebar-logo">AUROIC<span>control panel</span></div>
      <div class="conn-badge">
        <div class="conn-dot" id="connDot"></div>
        <span id="connStatus">Connecting…</span>
      </div>
      <nav id="nav">
        <div class="nav-item active" data-view="overview">
          <i data-lucide="layout-dashboard" class="icon"></i
          ><span>Overview</span>
        </div>
        <div class="nav-item" data-view="live">
          <i data-lucide="discord" class="icon"></i><span>Discord</span
          ><span class="nav-badge" id="badge-live">0</span>
        </div>
        <div class="nav-item" data-view="conversations">
          <i data-lucide="message-square" class="icon"></i><span>Chats</span
          ><span class="nav-badge" id="badge-conversations">0</span>
        </div>
        <div class="nav-item" data-view="messages">
          <i data-lucide="mail" class="icon"></i><span>Messages</span
          ><span class="nav-badge" id="badge-messages">0</span>
        </div>
        <div class="nav-item" data-view="users">
          <i data-lucide="users" class="icon"></i><span>Users</span
          ><span class="nav-badge" id="badge-users">0</span>
        </div>
        <div class="nav-item" data-view="media">
          <i data-lucide="image" class="icon"></i><span>Media</span
          ><span class="nav-badge" id="badge-media">0</span>
        </div>
        <div class="nav-item" data-view="reactions">
          <i data-lucide="heart" class="icon"></i><span>Reactions</span
          ><span class="nav-badge" id="badge-reactions">0</span>
        </div>
        <div class="nav-item" data-view="outgoing">
          <i data-lucide="send" class="icon"></i><span>Outgoing</span
          ><span class="nav-badge" id="badge-outgoing">0</span>
        </div>
        <div class="nav-item" data-view="router">
          <i data-lucide="git-branch" class="icon"></i><span>Router</span>
        </div>
        <div class="nav-item" data-view="commands">
          <i data-lucide="terminal" class="icon"></i><span>Commands</span
          ><span class="nav-badge" id="badge-commands">0</span>
        </div>
        <div class="nav-item" data-view="config">
          <i data-lucide="settings" class="icon"></i><span>Config</span>
        </div>
        <div class="nav-item" data-view="shell">
          <i data-lucide="square-terminal" class="icon"></i><span>Shell</span>
        </div>
      </nav>
      <div class="sidebar-footer" id="sidebarTime"></div>
    </aside>

    <main>
      <div class="topbar">
        <h1 id="viewTitle">Overview</h1>
        <input
          type="text"
          id="searchInput"
          placeholder="Search…"
          oninput="handleSearch(this.value)"
        />
        <div class="otp-panel hidden" id="otpPanel">
          <span class="otp-label" id="otpLabel">2FA required</span>
          <input
            id="otpInput"
            class="otp-input"
            type="text"
            inputmode="numeric"
            autocomplete="one-time-code"
            placeholder="Enter code"
            onkeydown="
              if (event.key === 'Enter') {
                event.preventDefault();
                submitOtpFromDashboard();
              }
            "
          />
          <button
            id="otpSubmit"
            class="otp-submit"
            onclick="submitOtpFromDashboard()"
          >
            Submit
          </button>
        </div>
        <div class="power-wrap" id="powerWrap">
          <button
            class="btn secondary power-btn"
            id="powerBtn"
            onclick="togglePowerMenu(event)"
          >
            <i data-lucide="power" class="power-icon"></i>
            <span id="powerLabel">Running</span>
          </button>
          <div class="power-menu hidden" id="powerMenu">
            <button
              class="power-item"
              id="powerPauseResumeBtn"
              onclick="handleSystemAction('toggle-pause')"
            >
              Pause System
            </button>
            <button
              class="power-item danger"
              onclick="handleSystemAction('reload-browser')"
            >
              Reload Browser
            </button>
          </div>
        </div>
        <button class="btn secondary" onclick="refreshAll()">↻ Refresh</button>
      </div>
      <div class="content" id="content"></div>
    </main>

    <div id="toast"></div>

    <script>
      // State

      const state = {
        view: "overview",
        conversations: [],
        messages: [],
        users: [],
        media: [],
        reactions: [],
        outgoing: [],
        commands: [],
        commandRegistry: [],
        ttsOptions: null,
        otp: { pending: false, requestedAt: null, submitting: false },
        config: null,
        configDirty: false,
        routerFeed: [],
        chatDetailId: null,
        chatMessages: [],
        liveSelectedChatId: null,
        liveMessages: [],
        liveUnreadByChat: {},
        liveActivity: [],
        liveBackTo: null,
        liveCompactThreadOpen: false,
        search: "",
        counts: {
          conversations: 0,
          messages: 0,
          users: 0,
          media: 0,
          reactions: 0,
          outgoing: 0,
          commands: 0,
          live: 0,
        },
        newBadges: { messages: false },
        shell: {
          output: [],
          history: [],
          historyIndex: -1,
          sessionId: null,
          running: false,
          cwd: "~",
          serverCwd: "",
          sseSource: null,
          waitingForPassword: false,
        },
        system: {
          paused: false,
          browserReloading: false,
          browserReloadingAt: null,
          busy: false,
        },
      };

      // Routing

      function setView(v) {
        state.view = v;
        state.chatDetailId = null;
        state.search = "";
        document.getElementById("searchInput").value = "";
        document.querySelectorAll(".nav-item").forEach((el) => {
          el.classList.toggle("active", el.dataset.view === v);
        });

        const isLive = v === "live";
        const isShell = v === "shell";
        document.body.classList.toggle("live-active", isLive);
        document.body.classList.toggle("shell-active", isShell);

        const titles = {
          overview: "Overview",
          conversations: "Chats",
          messages: "Messages",
          users: "Users",
          media: "Media",
          reactions: "Reactions",
          outgoing: "Outgoing",
          commands: "Commands",
          live: "Discord",
          router: "Router Feed",
          config: "Runtime Config",
          shell: "Shell",
        };
        document.getElementById("viewTitle").textContent = titles[v] || v;

        if (v === "live") {
          if (isCompactLiveLayout()) state.liveCompactThreadOpen = false;
          ensureLiveSelection();
        }
        if (v === "shell" && !state.shell.serverCwd) {
          fetchJSON("/api/shell/cwd").then((r) => {
            if (r?.cwd) {
              state.shell.serverCwd = r.cwd;
              state.shell.cwd = r.cwd;
              if (state.view === "shell") renderView();
            }
          });
        }
        updateTopbarForCurrentView();
        renderView();
      }

      document.getElementById("nav").addEventListener("click", (e) => {
        const item = e.target.closest(".nav-item");
        if (!item?.dataset.view) return;
        const v = item.dataset.view;
        if (v === state.view) return;
        document.getElementById("badge-" + v)?.classList.remove("new");
        setView(v);
      });

      // Data fetching

      let refreshAllInFlight = null;
      let refreshAllPending = false;
      let sseRefreshTimer = null;
      let pendingLiveRefreshChatId = null;

      async function fetchJSON(url) {
        try {
          const r = await fetch(url);
          if (!r.ok) throw new Error(`HTTP ${r.status}`);
          return await r.json();
        } catch (e) {
          console.warn("Fetch failed:", url, e.message);
          return null;
        }
      }

      async function refreshAll() {
        if (refreshAllInFlight) {
          refreshAllPending = true;
          return refreshAllInFlight;
        }

        refreshAllInFlight = (async () => {
          const [
            conversations,
            messages,
            users,
            media,
            reactions,
            outgoing,
            commands,
            commandRegistry,
            cfg,
            ttsOptions,
            otpStatus,
            systemStatus,
          ] = await Promise.all([
            fetchJSON("/api/conversations"),
            fetchJSON("/api/messages?limit=200"),
            fetchJSON("/api/users"),
            fetchJSON("/api/media?limit=100"),
            fetchJSON("/api/reactions?limit=200"),
            fetchJSON("/api/outgoing?limit=200"),
            fetchJSON("/api/commands"),
            fetchJSON("/api/commands/registry"),
            fetchJSON("/config"),
            state.ttsOptions
              ? Promise.resolve(null)
              : fetchJSON("/api/tts/options"),
            fetchJSON("/api/otp/status"),
            fetchJSON("/api/system/status"),
          ]);

          if (conversations) state.conversations = conversations;
          if (messages) state.messages = messages;
          if (users) state.users = users;
          if (media) state.media = media;
          if (reactions) state.reactions = reactions;
          if (outgoing) state.outgoing = outgoing;
          if (commands) state.commands = commands;
          if (commandRegistry) state.commandRegistry = commandRegistry;
          if (cfg && !state.configDirty) state.config = cfg;
          if (ttsOptions) state.ttsOptions = ttsOptions;
          if (otpStatus && typeof otpStatus.pending === "boolean") {
            state.otp.pending = otpStatus.pending;
            state.otp.requestedAt = otpStatus.requestedAt || null;
          }
          if (systemStatus && typeof systemStatus.paused === "boolean") {
            state.system.paused = Boolean(systemStatus.paused);
            state.system.browserReloading = Boolean(
              systemStatus.browserReloading,
            );
            state.system.browserReloadingAt =
              systemStatus.browserReloadingAt || null;
          }

          state.counts = {
            conversations: state.conversations.length,
            messages: state.messages.length,
            users: state.users.length,
            media: state.media.length,
            reactions: state.reactions.length,
            outgoing: state.outgoing.length,
            commands: state.commands.length,
            live: Object.values(state.liveUnreadByChat).reduce(
              (a, b) => a + b,
              0,
            ),
          };
          updateBadges();
          renderOtpPanel();
          renderPowerControls();
          if (state.view !== "config" && state.view !== "shell") renderView();
        })();

        try {
          await refreshAllInFlight;
        } finally {
          refreshAllInFlight = null;
          if (refreshAllPending) {
            refreshAllPending = false;
            queueMicrotask(() => {
              void refreshAll();
            });
          }
        }
      }

      function scheduleSSERefresh(chatId) {
        if (chatId && chatId === state.liveSelectedChatId) {
          pendingLiveRefreshChatId = chatId;
        }

        if (sseRefreshTimer) return;

        sseRefreshTimer = setTimeout(async () => {
          sseRefreshTimer = null;
          const liveChatId = pendingLiveRefreshChatId;
          pendingLiveRefreshChatId = null;
          await refreshAll();
          refreshLiveSelection(liveChatId);
        }, 250);
      }

      async function refreshSystemStatus() {
        const status = await fetchJSON("/api/system/status");
        if (!status || typeof status.paused !== "boolean") return;
        state.system.paused = Boolean(status.paused);
        state.system.browserReloading = Boolean(status.browserReloading);
        state.system.browserReloadingAt = status.browserReloadingAt || null;
        renderPowerControls();
      }

      function togglePowerMenu(event) {
        if (event) event.stopPropagation();
        const menu = document.getElementById("powerMenu");
        if (!menu) return;
        menu.classList.toggle("hidden");
      }

      function closePowerMenu() {
        const menu = document.getElementById("powerMenu");
        if (menu) menu.classList.add("hidden");
      }

      function renderPowerControls() {
        const label = document.getElementById("powerLabel");
        const powerBtn = document.getElementById("powerBtn");
        const pauseResumeBtn = document.getElementById("powerPauseResumeBtn");
        if (!label || !powerBtn || !pauseResumeBtn) return;

        const paused = state.system.paused;
        const restarting = state.system.browserReloading;
        const busy = Boolean(state.system.busy);

        label.textContent = restarting
          ? "Reloading Browser..."
          : paused
            ? "Paused"
            : "Running";

        powerBtn.classList.toggle("paused", paused && !restarting);
        powerBtn.classList.toggle("restarting", restarting);
        powerBtn.disabled = busy || restarting;

        pauseResumeBtn.textContent = paused ? "Resume System" : "Pause System";
        pauseResumeBtn.disabled = busy || restarting;
      }

      async function handleSystemAction(action) {
        if (state.system.busy) return;

        let normalizedAction = action;
        if (action === "toggle-pause") {
          normalizedAction = state.system.paused ? "resume" : "pause";
        }

        if (
          normalizedAction === "reload-browser" &&
          !window.confirm("Reload the browser session now?")
        ) {
          closePowerMenu();
          return;
        }

        state.system.busy = true;
        closePowerMenu();
        renderPowerControls();

        try {
          const res = await fetch("/api/system/control", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ action: normalizedAction }),
          });
          const payload = await res.json().catch(() => null);
          if (!res.ok) throw new Error(payload?.error || `HTTP ${res.status}`);

          if (payload?.state && typeof payload.state.paused === "boolean") {
            state.system.paused = Boolean(payload.state.paused);
            state.system.browserReloading = Boolean(
              payload.state.browserReloading,
            );
            state.system.browserReloadingAt =
              payload.state.browserReloadingAt || null;
          }

          showToast(payload?.message || "System control updated");

          if (normalizedAction === "reload-browser") {
            labelBrowserReloadPending();
          }
        } catch (err) {
          showToast(`System action failed: ${err?.message || String(err)}`);
        } finally {
          state.system.busy = false;
          renderPowerControls();
        }
      }

      function labelBrowserReloadPending() {
        state.system.browserReloading = true;
        state.system.browserReloadingAt = Date.now();
        renderPowerControls();
      }

      async function refreshOtpStatus() {
        const status = await fetchJSON("/api/otp/status");
        if (!status || typeof status.pending !== "boolean") return;
        state.otp.pending = status.pending;
        state.otp.requestedAt = status.requestedAt || null;
        renderOtpPanel();
      }

      function renderOtpPanel() {
        const panel = document.getElementById("otpPanel");
        const label = document.getElementById("otpLabel");
        const input = document.getElementById("otpInput");
        const submit = document.getElementById("otpSubmit");
        if (!panel || !label || !input || !submit) return;
        panel.classList.toggle("hidden", !state.otp.pending);
        if (!state.otp.pending) {
          input.value = "";
          submit.disabled = false;
          state.otp.submitting = false;
          return;
        }
        const requestedAt = state.otp.requestedAt
          ? new Date(state.otp.requestedAt).toLocaleTimeString()
          : null;
        label.textContent = requestedAt
          ? `2FA required since ${requestedAt}`
          : "2FA required";
        submit.disabled = state.otp.submitting;
      }

      async function submitOtpFromDashboard() {
        if (!state.otp.pending || state.otp.submitting) return;
        const input = document.getElementById("otpInput");
        const submit = document.getElementById("otpSubmit");
        const code = String(input?.value || "").trim();
        if (!code) {
          showToast("Enter OTP code");
          return;
        }
        state.otp.submitting = true;
        if (submit) submit.disabled = true;
        try {
          const res = await fetch("/api/otp/submit", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ code }),
          });
          const payload = await res.json().catch(() => null);
          if (!res.ok) throw new Error(payload?.error || `HTTP ${res.status}`);
          if (input) input.value = "";
          showToast("OTP submitted");
        } catch (err) {
          showToast(`OTP submit failed: ${err?.message || String(err)}`);
        } finally {
          state.otp.submitting = false;
          await refreshOtpStatus();
        }
      }

      async function loadConfig() {
        const cfg = await fetchJSON("/config");
        if (cfg) {
          state.config = cfg;
          state.configDirty = false;
        }
      }

      function updateBadges() {
        [
          "conversations",
          "messages",
          "users",
          "media",
          "reactions",
          "outgoing",
          "commands",
        ].forEach((k) => {
          const el = document.getElementById("badge-" + k);
          if (el) el.textContent = state.counts[k];
        });
        const liveUnread = Object.values(state.liveUnreadByChat).reduce(
          (a, b) => a + b,
          0,
        );
        const liveBadge = document.getElementById("badge-live");
        if (liveBadge) {
          liveBadge.textContent = String(liveUnread);
          liveBadge.classList.toggle("new", liveUnread > 0);
        }
      }

      // SS

      function connectSSE() {
        const es = new EventSource("/events");
        const dot = document.getElementById("connDot");
        const st = document.getElementById("connStatus");
        es.onopen = () => {
          dot.classList.add("live");
          st.textContent = "Live";
        };
        es.onerror = () => {
          dot.classList.remove("live");
          st.textContent = "Reconnecting…";
        };
        es.onmessage = (e) => handleSSEEvent(JSON.parse(e.data));
      }

      document.addEventListener("click", (event) => {
        const wrap = document.getElementById("powerWrap");
        const target = event.target;
        if (!wrap || !(target instanceof Node)) return;
        if (!wrap.contains(target)) closePowerMenu();
      });

      function handleSSEEvent(ev) {
        const now = new Date().toLocaleTimeString();
        if (ev.chatId && ev.chatId !== state.liveSelectedChatId) {
          state.liveUnreadByChat[ev.chatId] =
            (state.liveUnreadByChat[ev.chatId] || 0) + 1;
        }
        appendLiveActivity(ev, now);
        updateBadges();

        switch (ev.type) {
          case "NEW_MESSAGE":
            scheduleSSERefresh(ev.chatId);
            if (state.view !== "messages")
              document.getElementById("badge-messages")?.classList.add("new");
            appendFeed({
              text: `NEW_MESSAGE  chat:${shortId(ev.chatId)}  mid:${shortId(ev.mid)}`,
              time: now,
            });
            break;
          case "EDIT":
            scheduleSSERefresh(ev.chatId);
            appendFeed({
              text: `EDIT  chat:${shortId(ev.chatId)}  mid:${shortId(ev.mid)}`,
              time: now,
            });
            break;
          case "DELETE":
            scheduleSSERefresh(ev.chatId);
            appendFeed({
              text: `DELETE  chat:${shortId(ev.chatId)}  mid:${shortId(ev.mid)}`,
              time: now,
            });
            break;
          case "REACTION_ADD":
            scheduleSSERefresh(ev.chatId);
            appendFeed({
              text: `REACTION+  chat:${shortId(ev.chatId)}  ${ev.reaction}`,
              time: now,
            });
            break;
          case "REACTION_REMOVE":
            scheduleSSERefresh(ev.chatId);
            appendFeed({
              text: `REACTION-  chat:${shortId(ev.chatId)}`,
              time: now,
            });
            break;
          case "ROUTER_DECISION":
            appendFeed({
              text: `ROUTER  chat:${shortId(ev.chatId)}  type:${ev.decision.type}  effort:${ev.decision.effort}  title:${ev.decision.title}`,
              time: now,
            });
            if (state.view === "router") renderView();
            break;
          case "OUTGOING":
            scheduleSSERefresh(ev.chatId);
            appendFeed({
              text: `OUTGOING  chat:${shortId(ev.chatId)}  ${ev.actionType}`,
              time: now,
            });
            break;
          case "CONFIG_CHANGED":
            if (state.configDirty) {
              showToast("Config changed in DB — you have unsaved edits");
            } else {
              loadConfig().then(() => {
                if (state.view === "config") renderView();
                showToast("Config reloaded from DB");
              });
            }
            break;
        }
      }

      function appendFeed(item) {
        state.routerFeed.unshift(item);
        if (state.routerFeed.length > 200) state.routerFeed.pop();
        if (state.view === "router") renderView();
      }

      function appendLiveActivity(ev, now) {
        if (!ev.type || !ev.chatId) return;
        const note =
          `${ev.type} ${shortId(ev.chatId)} ${ev.mid ? shortId(ev.mid) : ""}`.trim();
        state.liveActivity.unshift({
          text: note,
          time: now,
          chatId: ev.chatId,
        });
        if (state.liveActivity.length > 36) state.liveActivity.pop();
        if (state.view === "live" && !isInputFocused()) renderView();
      }

      function refreshLiveSelection(chatId) {
        if (!state.liveSelectedChatId) return;
        if (chatId && chatId !== state.liveSelectedChatId) return;
        setLiveChat(state.liveSelectedChatId, true);
      }

      function shortId(id) {
        return id ? String(id).slice(-8) : "?";
      }

      // Renderin

      function renderView() {
        const el = document.getElementById("content");
        switch (state.view) {
          case "overview":
            el.innerHTML = renderOverview();
            break;
          case "conversations":
            el.innerHTML = state.chatDetailId
              ? renderChatDetail()
              : renderChats();
            break;
          case "messages":
            el.innerHTML = renderMessages();
            break;
          case "users":
            el.innerHTML = renderUsers();
            break;
          case "media":
            el.innerHTML = renderMedia();
            break;
          case "reactions":
            el.innerHTML = renderReactions();
            break;
          case "outgoing":
            el.innerHTML = renderOutgoing();
            break;
          case "live":
            saveLiveInputState();
            el.innerHTML = renderLive();
            break;
          case "router":
            el.innerHTML = renderRouter();
            break;
          case "commands":
            renderCommandsView(el);
            return;
          case "config":
            renderConfigView(el);
            return;
          case "shell":
            renderShellView(el);
            return;
          default:
            el.innerHTML = '<div class="empty">Select a view</div>';
        }

        el.querySelectorAll("[data-chat-click]").forEach((r) =>
          r.addEventListener("click", () =>
            openChatDetail(r.dataset.chatClick),
          ),
        );
        el.querySelectorAll("[data-chat-enable-wrap]").forEach((node) =>
          node.addEventListener("click", (e) => e.stopPropagation()),
        );
        el.querySelectorAll("[data-chat-enable]").forEach((inputEl) => {
          inputEl.addEventListener("click", (e) => e.stopPropagation());
          inputEl.addEventListener("change", (e) => {
            const t = e.currentTarget;
            if (!(t instanceof HTMLInputElement)) return;
            const chatId = t.dataset.chatEnable;
            if (!chatId) return;
            setChatEnabled(chatId, t.checked, t);
          });
        });
        el.querySelectorAll("[data-live-chat-click]").forEach((r) =>
          r.addEventListener("click", () =>
            setLiveChat(r.dataset.liveChatClick),
          ),
        );

        const scroll = document.getElementById("liveMsgScroll");
        if (scroll) scroll.scrollTop = scroll.scrollHeight;

        if (state.view === "live" && state._savedLiveInput) {
          const liveInput = document.getElementById("liveCommandInput");
          if (liveInput) {
            liveInput.value = state._savedLiveInput.value;
            if (state._savedLiveInput.wasFocused) {
              liveInput.focus();
              liveInput.setSelectionRange(
                state._savedLiveInput.selStart,
                state._savedLiveInput.selEnd,
              );
            }
          }
          state._savedLiveInput = null;
        }
        updateTopbarForCurrentView();
      }

      function isCompactLiveLayout() {
        return window.matchMedia("(max-width: 980px)").matches;
      }

      function updateTopbarForCurrentView() {
        const searchInput = document.getElementById("searchInput");
        if (!searchInput) return;
        if (!window.matchMedia("(min-width: 981px)").matches) return;
        searchInput.classList.toggle(
          "hidden",
          state.view === "live" && state.liveCompactThreadOpen,
        );
      }

      function renderOverview() {
        const c = state.counts;
        return `
<div class="stats-grid">
  <div class="stat-card"><div class="val">${c.conversations}</div><div class="lbl">Chats</div></div>
  <div class="stat-card"><div class="val">${c.messages}</div><div class="lbl">Messages</div></div>
  <div class="stat-card"><div class="val">${c.users}</div><div class="lbl">Users</div></div>
  <div class="stat-card"><div class="val">${c.media}</div><div class="lbl">Media items</div></div>
  <div class="stat-card"><div class="val">${c.reactions}</div><div class="lbl">Reactions</div></div>
  <div class="stat-card"><div class="val">${c.outgoing}</div><div class="lbl">Outgoing actions</div></div>
</div>
<div class="card">
  <div class="card-header">Recent Events (live)</div>
  <div style="padding:14px">
    ${
      state.routerFeed.length === 0
        ? '<div class="empty" style="padding:20px">No events yet — events appear here in real time</div>'
        : state.routerFeed
            .slice(0, 20)
            .map(
              (f) =>
                `<div class="feed-item"><span class="feed-time">${esc(f.time)}</span>${esc(f.text)}</div>`,
            )
            .join("")
    }
  </div>
</div>`;
      }

      function renderChats() {
        const enabledChatIds = new Set(
          Array.isArray(state.config?.discord?.allowedChannels)
            ? state.config.discord.allowedChannels
                .map((v) => String(v).trim())
                .filter(Boolean)
            : [],
        );
        const hasExplicitEnabledFilter = enabledChatIds.size > 0;
        const rows = state.conversations.filter(
          (c) =>
            !state.search ||
            c.title?.toLowerCase().includes(state.search) ||
            c.conversationId.includes(state.search),
        );
        if (!rows.length)
          return '<div class="empty">No conversations found</div>';
        return `<div class="card"><table>
<thead><tr><th>Enabled</th><th>Chat ID</th><th>Title</th><th>Group</th><th>Muted</th><th>Last Processed MID</th></tr></thead>
<tbody>${rows
          .map(
            (c) => `
  <tr data-chat-click="${esc(c.conversationId)}" style="cursor:pointer">
    <td style="text-align:center" data-chat-enable-wrap>
      <label class="toggle">
        <input data-chat-enable="${esc(c.conversationId)}" type="checkbox" ${!hasExplicitEnabledFilter || enabledChatIds.has(c.conversationId) ? "checked" : ""} />
        <span class="slider"></span>
      </label>
    </td>
    <td>${esc(c.conversationId)}</td>
    <td>${esc(c.title || "—")}</td>
    <td>${c.isGroup ? "✓" : "—"}</td>
    <td>${c.isMuted ? "✓" : "—"}</td>
    <td>${esc(c.lastProcessedMessageId || "—")}</td>
  </tr>`,
          )
          .join("")}
</tbody></table></div>`;
      }

      function openChatDetail(chatId) {
        state.liveBackTo = "conversations";
        setView("live");
        setLiveChat(chatId);
      }

      function renderChatDetail() {
        const msgs = state.chatMessages;
        const botId = state.config?.discord?.clientUserId || state.config?.instagram?.fbId;
        return `
<button class="breadcrumb" onclick="state.chatDetailId=null; setView('conversations')">← Back to conversations</button>
<br/><br/>
<div class="msg-list">
  ${
    msgs.length === 0
      ? '<div class="empty">No messages</div>'
      : msgs
          .slice()
          .reverse()
          .map(
            (m) => `
    <div class="msg-bubble${m.userId === botId ? " outgoing" : ""}">
      <div class="msg-meta">${esc(m.userId)} · ${new Date(m.timestampMs).toLocaleString()} · ${esc(m.messageType || "?")}${m.isEdited ? " [edited]" : ""}${m.isDeleted ? " [deleted]" : ""}</div>
      <div class="msg-body">${esc(m.textContent || "[no text]")}</div>
    </div>`,
          )
          .join("")
  }
</div>`;
      }

      function renderMessages() {
        const rows = state.messages.filter(
          (m) =>
            !state.search ||
            m.textContent?.toLowerCase().includes(state.search) ||
            m.userId.includes(state.search) ||
            m.conversationId.includes(state.search),
        );
        if (!rows.length) return '<div class="empty">No messages found</div>';
        return `<div class="card"><table>
<thead><tr><th>MID</th><th>Chat</th><th>Sender</th><th>Type</th><th>Text</th><th>Time</th><th>E/D</th></tr></thead>
<tbody>${rows
          .map(
            (m) => `
  <tr>
    <td title="${esc(m.messageId)}">${esc(m.messageId.slice(-12))}</td>
    <td>${esc(m.conversationId)}</td>
    <td>${esc(m.userId)}</td>
    <td><span class="tag text">${esc(m.messageType || "?")}</span></td>
    <td title="${esc(m.textContent || "")}">${esc((m.textContent || "").slice(0, 60))}</td>
    <td>${new Date(m.timestampMs).toLocaleString()}</td>
    <td>${m.isEdited ? "E" : ""}${m.isDeleted ? "D" : ""}</td>
  </tr>`,
          )
          .join("")}
</tbody></table></div>`;
      }

      function renderUsers() {
        const rows = state.users.filter(
          (u) =>
            !state.search ||
            u.username?.toLowerCase().includes(state.search) ||
            u.displayName?.toLowerCase().includes(state.search) ||
            u.userId.includes(state.search),
        );
        if (!rows.length) return '<div class="empty">No users found</div>';
        return `<div class="card"><table>
<thead><tr><th>User ID</th><th>Username</th><th>Display Name</th><th>Verified</th><th>Since</th></tr></thead>
<tbody>${rows
          .map(
            (u) => `
  <tr>
    <td>${esc(u.userId)}</td>
    <td>${esc(u.username || "—")}</td>
    <td>${esc(u.displayName || "—")}</td>
    <td>${u.isVerified ? "✓" : "—"}</td>
    <td>${u.createdAt ? new Date(u.createdAt).toLocaleDateString() : "—"}</td>
  </tr>`,
          )
          .join("")}
</tbody></table></div>`;
      }

      function renderMedia() {
        const rows = state.media.filter(
          (m) =>
            !state.search ||
            m.attachmentType?.toLowerCase().includes(state.search) ||
            m.messageId.includes(state.search),
        );
        if (!rows.length) return '<div class="empty">No media found</div>';
        return `<div class="card"><table>
<thead><tr><th>Message ID</th><th>Type</th><th>URL</th><th>Dimensions</th><th>Duration</th></tr></thead>
<tbody>${rows
          .map(
            (m) => `
  <tr>
    <td>${esc(m.messageId.slice(-12))}</td>
    <td><span class="tag media">${esc(m.attachmentType || "?")}</span></td>
    <td title="${esc(m.url || "")}"><a href="${esc(m.url || "")}" target="_blank" style="color:var(--accent)">${esc((m.url || "").slice(0, 40))}</a></td>
    <td>${m.width && m.height ? m.width + "×" + m.height : "—"}</td>
    <td>${m.durationMs ? m.durationMs + "ms" : "—"}</td>
  </tr>`,
          )
          .join("")}
</tbody></table></div>`;
      }

      function renderReactions() {
        const rows = state.reactions.filter(
          (r) =>
            !state.search ||
            r.reaction.toLowerCase().includes(state.search) ||
            r.userId.includes(state.search),
        );
        if (!rows.length) return '<div class="empty">No reactions found</div>';
        return `<div class="card"><table>
<thead><tr><th>Message ID</th><th>Sender</th><th>Reaction</th><th>Time</th></tr></thead>
<tbody>${rows
          .map(
            (r) => `
  <tr>
    <td>${esc(r.messageId.slice(-12))}</td>
    <td>${esc(r.userId)}</td>
    <td>${esc(r.reaction)}</td>
    <td>${r.timestampMs ? new Date(r.timestampMs).toLocaleString() : "—"}</td>
  </tr>`,
          )
          .join("")}
</tbody></table></div>`;
      }

      function renderOutgoing() {
        const rows = state.outgoing.filter(
          (o) =>
            !state.search ||
            o.actionType.toLowerCase().includes(state.search) ||
            o.conversationId.includes(state.search) ||
            o.intentLabel?.toLowerCase().includes(state.search),
        );
        if (!rows.length)
          return '<div class="empty">No outgoing entries found</div>';
        return `<div class="card"><table>
<thead><tr><th>ID</th><th>Chat</th><th>Type</th><th>Effort</th><th>Intent</th><th>Content</th><th>Time</th></tr></thead>
<tbody>${rows
          .map(
            (o) => `
  <tr>
    <td>${o.id}</td>
    <td>${esc(o.conversationId)}</td>
    <td><span class="tag ${esc(o.actionType)}">${esc(o.actionType)}</span></td>
    <td>${esc(o.effortLevel || "—")}</td>
    <td title="${esc(o.intentLabel || "")}">${esc((o.intentLabel || "—").slice(0, 30))}</td>
    <td title="${esc(o.messageContent || "")}">${esc((o.messageContent || "—").slice(0, 60))}</td>
    <td>${o.createdAt ? new Date(o.createdAt).toLocaleString() : "—"}</td>
  </tr>`,
          )
          .join("")}
</tbody></table></div>`;
      }

      function renderRouter() {
        if (!state.routerFeed.length)
          return '<div class="empty">No router events yet — events appear here live via SSE</div>';
        return `<div class="live-feed">${state.routerFeed
          .map(
            (f) =>
              `<div class="feed-item"><span class="feed-time">${esc(f.time)}</span><span class="feed-type">›</span>${esc(f.text)}</div>`,
          )
          .join("")}</div>`;
      }

      function buildLiveSummaries() {
        const recentByChat = new Map();
        for (const m of state.messages) {
          const prev = recentByChat.get(m.conversationId);
          if (!prev || m.timestampMs > prev.timestampMs)
            recentByChat.set(m.conversationId, m);
        }
        const botId = state.config?.discord?.clientUserId || state.config?.instagram?.fbId;
        return state.conversations
          .map((c) => {
            const recent = recentByChat.get(c.conversationId);
            let avatarUrl = c.avatarUrl || null;
            if (!avatarUrl && !c.isGroup) {
              const otherMsg = state.messages.find(
                (m) =>
                  m.conversationId === c.conversationId && m.userId !== botId,
              );
              if (otherMsg) {
                const otherUser = state.users.find(
                  (u) => u.userId === otherMsg.userId,
                );
                avatarUrl = otherUser?.avatarUrl || null;
              }
            }
            return {
              id: c.conversationId,
              title: c.title || `Chat ${shortId(c.conversationId)}`,
              preview: recent?.textContent || "No recent text",
              at: recent?.timestampMs || 0,
              unread: state.liveUnreadByChat[c.conversationId] || 0,
              avatarUrl,
            };
          })
          .filter(
            (c) =>
              !state.search ||
              c.title.toLowerCase().includes(state.search) ||
              c.id.includes(state.search) ||
              c.preview.toLowerCase().includes(state.search),
          )
          .sort((a, b) => b.at - a.at);
      }

      function buildMessageGroups(messages, botId) {
        const sorted = messages
          .slice()
          .sort((a, b) => a.timestampMs - b.timestampMs);
        const groups = [];
        for (const m of sorted) {
          const last = groups[groups.length - 1];
          if (last && last.userId === m.userId && !m.replyToMessageId) {
            last.messages.push(m);
          } else {
            const userObj = state.users.find((u) => u.userId === m.userId);
            const displayName =
              userObj?.displayName || userObj?.username || shortId(m.userId);
            const avatarUrl = userObj?.avatarUrl || null;
            groups.push({
              userId: m.userId,
              displayName,
              avatarUrl,
              messages: [m],
            });
          }
        }
        return groups;
      }

      function renderMessageGroups(groups, botId) {
        if (!groups.length)
          return '<div style="color:#a8a8a8;text-align:center;padding:40px 0;font-size:14px">No messages yet</div>';
        const msgById = new Map();
        for (const g of groups)
          for (const m of g.messages)
            msgById.set(m.messageId, {
              m,
              userId: g.userId,
              displayName: g.displayName,
            });
        return groups
          .map((g) => {
            const isOut = g.userId === botId;
            const count = g.messages.length;
            const bubblesHtml = g.messages
              .map((m, i) => {
                let pos = "solo";
                if (count > 1) {
                  if (i === 0) pos = "first";
                  else if (i === count - 1) pos = "last";
                  else pos = "mid";
                }
                const deletedClass = m.isDeleted ? " deleted" : "";
                const mediaOnlyClass = isMediaOnlyMessage(m)
                  ? " has-media"
                  : "";
                const editedMark = m.isEdited
                  ? ' <span style="font-size:10px;opacity:.55">(edited)</span>'
                  : "";
                const bodyHtml = renderLiveMessageBody(m);
                const bubble = `<div class="live-bubble ${pos}${isOut ? " out" : ""}${deletedClass}${mediaOnlyClass}">${bodyHtml}${editedMark}</div>`;
                if (m.replyToMessageId) {
                  const replied = msgById.get(m.replyToMessageId);
