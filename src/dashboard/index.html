                  const repliedToBot = replied
                    ? replied.userId === botId
                    : false;
                  let labelName = repliedToBot
                    ? "you"
                    : replied
                      ? (() => {
                          const ru = state.users.find(
                            (u) => u.userId === replied.userId,
                          );
                          return (
                            ru?.displayName ||
                            ru?.username ||
                            replied.displayName ||
                            shortId(replied.userId)
                          );
                        })()
                      : null;
                  const senderName = isOut ? "You" : esc(g.displayName);
                  const label = labelName
                    ? `<div class="live-reply-label">${senderName} replied to ${esc(labelName)}</div>`
                    : "";
                  const repliedType = String(replied?.m?.messageType || "")
                    .trim()
                    .replace(/_/g, " ")
                    .toLowerCase();
                  const quoteText = replied
                    ? esc(
                        replied.m.textContent ||
                          (repliedType ? `[${repliedType}]` : "[media]"),
                      )
                    : "[original message]";
                  const quoteTone = repliedToBot
                    ? "source-outgoing"
                    : "source-incoming";
                  const quote = `<div class="live-reply-quote ${quoteTone}"><span class="live-reply-quote-text">${quoteText}</span></div>`;
                  return `<div class="live-bubble-wrap">${label}${quote}${bubble}</div>`;
                }
                return bubble;
              })
              .join("");

            if (isOut) {
              return `<div class="live-msg-group outgoing">
  <div class="live-group-body outgoing"><div class="live-bubbles">${bubblesHtml}</div></div>
</div>`;
            }
            const isReplyGroup = !!g.messages[0]?.replyToMessageId;
            const nameRow = isReplyGroup
              ? ""
              : `<div class="live-group-name">${esc(g.displayName)}</div>`;
            const avatarHtml = g.avatarUrl
              ? `<img src="${esc(g.avatarUrl)}" style="width:100%;height:100%;object-fit:cover">`
              : esc(initials(g.displayName));
            return `<div class="live-msg-group incoming">
  ${nameRow}
  <div class="live-group-body">
    <div class="live-msg-avatar">${avatarHtml}</div>
    <div class="live-bubbles">${bubblesHtml}</div>
  </div>
</div>`;
          })
          .join("");
      }

      function renderLiveMessageBody(message) {
        if (message.isDeleted) return "Message deleted";

        const text = String(message.textContent || "").trim();
        const mediaHtml = renderLiveMediaList(message.media);

        if (text && !mediaHtml) return esc(text);
        if (!text && mediaHtml) return mediaHtml;
        if (text && mediaHtml) {
          return `<div class="live-media-stack"><div>${esc(text)}</div>${mediaHtml}</div>`;
        }

        const typeFallback = String(message.messageType || "")
          .trim()
          .replace(/_/g, " ")
          .toLowerCase();
        if (typeFallback) return `[${esc(typeFallback)}]`;
        return "[empty]";
      }

      function renderLiveMediaList(mediaItems) {
        if (!Array.isArray(mediaItems) || mediaItems.length === 0) return "";

        return `<div class="live-media-stack">${mediaItems
          .map((item) => renderLiveMediaCard(item))
          .join("")}</div>`;
      }

      function isMediaOnlyMessage(message) {
        const text = String(message?.textContent || "").trim();
        const mediaItems = Array.isArray(message?.media) ? message.media : [];
        return !text && mediaItems.length > 0;
      }

      function renderLiveMediaCard(item) {
        const attachmentType = String(item?.attachmentType || "media").trim();
        const normalizedType = attachmentType.toLowerCase();
        const previewUrl = String(item?.previewUrl || item?.url || "").trim();
        const fullUrl = String(item?.url || previewUrl || "").trim();
        const hasImage = previewUrl && isPreviewImageType(normalizedType);
        const isXmaType = normalizedType.includes("xma");
        const label = liveMediaLabel(normalizedType);

        const mediaInner = hasImage
          ? `<img class="live-media-thumb" loading="lazy" src="${esc(previewUrl)}" alt="${esc(label)} preview" />`
          : `<div class="live-media-fallback">${esc(label)}${fullUrl ? " attached" : ""}</div>`;

        const openOverlay =
          fullUrl && (hasImage || isXmaType)
            ? `<a class="live-media-open" href="${esc(fullUrl)}" target="_blank" rel="noopener noreferrer">open</a>`
            : "";

        return `<div class="live-media-card">
  ${mediaInner}
  ${openOverlay}
</div>`;
      }

      function isPreviewImageType(type) {
        if (!type) return true;
        return ["image", "gif", "sticker", "reel", "video", "clip"].some((t) =>
          type.includes(t),
        );
      }

      function liveMediaLabel(type) {
        if (!type) return "Media";
        if (type.includes("music")) return "Music";
        if (type.includes("sticker")) return "Sticker";
        if (type.includes("gif")) return "GIF";
        if (type.includes("reel")) return "Reel";
        if (type.includes("video") || type.includes("clip")) return "Video";
        if (type.includes("image") || type.includes("photo")) return "Image";
        return type
          .split(/[_\s-]+/)
          .map((part) => part.charAt(0).toUpperCase() + part.slice(1))
          .join(" ");
      }

      function renderLive() {
        const chats = buildLiveSummaries();
        const selected = state.liveSelectedChatId;
        const compactLive = isCompactLiveLayout();
        const showInboxPane = !compactLive || !state.liveCompactThreadOpen;
        const showThreadPane = !compactLive || state.liveCompactThreadOpen;
        const selectedChat = state.conversations.find(
          (c) => c.conversationId === selected,
        );
        const selectedTitle =
          selectedChat?.title ||
          chats.find((c) => c.id === selected)?.title ||
          "Direct Messages";
        const botId = state.config?.discord?.clientUserId || state.config?.instagram?.fbId;
        const groups = selected
          ? buildMessageGroups(state.liveMessages, botId)
          : [];
        const botUser = state.users.find((u) => u.userId === botId);
        const botName = botUser?.username
          ? `@${botUser.username}`
          : botUser?.displayName || "@bot";

        return `<div class="live-root"><div class="live-shell">
${
  showInboxPane
    ? `<div class="live-inbox-pane">
  <div class="live-inbox-header">
    <div class="live-inbox-username">${esc(botName)}</div>
    <div class="live-inbox-sub">Inbox · ${chats.length} conversation${chats.length !== 1 ? "s" : ""}</div>
  </div>
  <div class="live-inbox-list">
    ${
      chats.length === 0
        ? '<div style="color:#a8a8a8;text-align:center;padding:32px 16px;font-size:14px">No conversations</div>'
        : chats
            .map(
              (
                c,
              ) => `<div class="live-chat-row${c.id === selected ? " active" : ""}" data-live-chat-click="${esc(c.id)}">
      <div class="live-avatar">${c.avatarUrl ? `<img src="${esc(c.avatarUrl)}" style="width:100%;height:100%;object-fit:cover">` : esc(initials(c.title))}</div>
      <div class="live-chat-info">
        <div class="live-chat-title">${esc(c.title)}</div>
        <div class="live-chat-preview">${esc(c.preview)}</div>
      </div>
      <div class="live-chat-meta">
        <div class="live-chat-time">${c.at ? formatTime(c.at) : ""}</div>
        ${c.unread ? `<div class="live-unread">${c.unread}</div>` : ""}
      </div>
    </div>`,
            )
            .join("")
    }
  </div>
</div>`
    : ""
}
${
  showThreadPane
    ? `<div class="live-thread-pane">
  ${
    !selected
      ? '<div style="color:#a8a8a8;text-align:center;padding:80px 24px;font-size:14px">Select a conversation</div>'
      : `
  <div class="live-thread-header">
    ${compactLive ? '<button class="live-thread-back" onclick="openLiveInbox()">&lsaquo;</button>' : ""}
    <div class="live-thread-avatar">${selectedChat?.avatarUrl ? `<img src="${esc(selectedChat.avatarUrl)}" style="width:100%;height:100%;object-fit:cover">` : esc(initials(selectedTitle))}</div>
    <div>
      <div class="live-thread-name">${esc(selectedTitle)}</div>
      <div class="live-thread-status">Discord · text and command send enabled</div>
    </div>
  </div>
  <div class="live-msg-scroll" id="liveMsgScroll">
    <div class="live-scroll-spacer"></div>
    ${renderMessageGroups(groups, botId)}
  </div>
  <div class="live-command-bar">
    <input id="liveCommandInput" class="live-command-input" type="text" placeholder="Type a message or command (e.g. /gif cat)"
      onkeydown="if(event.key==='Enter'){event.preventDefault();executeLiveCommand();}" />
    <button id="liveCommandSend" class="live-command-send" onclick="executeLiveCommand()">Send</button>
  </div>
  <div class="live-command-status" id="liveCommandStatus"></div>
  <div class="live-activity">
    ${
      state.liveActivity.length === 0
        ? '<span class="live-pill">no events yet</span>'
        : state.liveActivity
            .slice(0, 12)
            .map(
              (a) =>
                `<span class="live-pill">${esc(a.time)} ${esc(a.text)}</span>`,
            )
            .join("")
    }
  </div>`
  }
</div>`
    : ""
}
</div></div>`;
      }

      function openLiveInbox() {
        state.liveCompactThreadOpen = false;
        if (state.view === "live") renderView();
      }

      function initials(name) {
        const parts = String(name || "DC")
          .trim()
          .split(/\s+/)
          .slice(0, 2);
        return parts.map((p) => p[0]?.toUpperCase() || "").join("") || "DC";
      }
      function formatTime(ts) {
        return new Date(ts).toLocaleTimeString([], {
          hour: "2-digit",
          minute: "2-digit",
        });
      }

      function ensureLiveSelection() {
        if (state.liveSelectedChatId) return;
        const first = state.conversations[0]?.conversationId;
        if (first) setLiveChat(first);
      }

      function setLiveChat(chatId, silentRender = false) {
        if (!chatId) return;
        state.liveSelectedChatId = chatId;
        if (isCompactLiveLayout()) state.liveCompactThreadOpen = true;
        state.liveUnreadByChat[chatId] = 0;
        updateBadges();
        fetchJSON(`/api/conversations/${chatId}/messages?limit=200`).then(
          (msgs) => {
            state.liveMessages = msgs || [];
            if (state.view === "live" || !silentRender) {
              saveLiveInputState();
              renderView();
            }
          },
        );
      }

      async function executeLiveCommand() {
        const chatId = state.liveSelectedChatId;
        if (!chatId) {
          showToast("Select a conversation first");
          return;
        }
        const input = document.getElementById("liveCommandInput");
        const button = document.getElementById("liveCommandSend");
        const status = document.getElementById("liveCommandStatus");
        const rawInput = String(input?.value || "").trim();
        if (!rawInput) {
          showToast("Type a message first");
          return;
        }
        if (button) button.disabled = true;
        if (status) status.textContent = "Sending...";
        try {
          const response = await fetch("/api/commands/execute", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ chatId, input: rawInput }),
          });
          const payload = await response.json();
          if (!response.ok)
            throw new Error(payload.error || `HTTP ${response.status}`);
          if (input) input.value = "";
          if (payload.mode === "command") {
            const commandName =
              payload.classifiedCommand?.commandName || "command";
            if (status) status.textContent = `Executed command: ${commandName}`;
            showToast(`Command executed: ${commandName}`);
          } else {
            if (status) status.textContent = "Text message sent";
            showToast("Text message sent");
          }
          await refreshAll();
          refreshLiveSelection(chatId);
        } catch (err) {
          const message = err instanceof Error ? err.message : String(err);
          if (status) status.textContent = `Send failed: ${message}`;
          showToast(`Send failed: ${message}`);
        } finally {
          if (button) button.disabled = false;
        }
      }

      window.addEventListener("resize", () => {
        if (state.view !== "live") {
          updateTopbarForCurrentView();
          return;
        }
        renderView();
      });

      // Commands management

      function renderCommandsView(el) {
        const rows = (state.commands || []).map((row) => ({
          command: row.command,
          aliases: Array.isArray(row.aliases) ? row.aliases : [],
          isEnabled: Boolean(row.isEnabled),
          handlerName: row.handlerName || "",
          filterKeywords: Array.isArray(row.filterKeywords)
            ? row.filterKeywords
            : [],
        }));

        const filteredRows = rows.filter((row) => {
          if (!state.search) return true;
          const hay =
            `${row.command} ${row.aliases.join(",")} ${row.filterKeywords.join(",")}`.toLowerCase();
          return hay.includes(state.search.toLowerCase());
        });

        const makePills = (items, prefix) =>
          items.length === 0
            ? `<span class="kw-empty">—</span>`
            : items
                .map((v) => `<span class="kw-pill">${prefix}${esc(v)}</span>`)
                .join("");

        el.innerHTML = `
<div style="margin-bottom:18px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap">
  <div>
    <h2 style="margin:0 0 8px 0">Commands (${rows.length})</h2>
    <p style="color:var(--subtle);margin:0">Edit aliases, enabled state, and filter keywords. Command and handler are read-only.</p>
  </div>
  <button class="btn" id="cmd-save">Save</button>
</div>
<div class="card">
  ${
    filteredRows.length === 0
      ? '<div class="empty">No commands found</div>'
      : `
  <table>
    <thead><tr><th>Command</th><th>Aliases</th><th style="text-align:center">Enabled</th><th>Handler</th><th>Filter Keywords</th></tr></thead>
    <tbody>
      ${filteredRows
        .map(
          (row) => `
      <tr data-command-row="${esc(row.command)}">
        <td style="font-weight:600;font-family:var(--mono);font-size:13px;white-space:nowrap">${esc(row.command)}</td>
        <td class="kw-cell">
          <div class="kw-pills-wrap">${makePills(row.aliases, "/")}</div>
          <input data-aliases type="text" class="field-input kw-input" value="${esc(row.aliases.join(", "))}" />
        </td>
        <td style="text-align:center">
          <label class="toggle">
            <input data-enabled type="checkbox" ${row.isEnabled ? "checked" : ""} />
            <span class="slider"></span>
          </label>
        </td>
        <td style="font-family:var(--mono);font-size:12px;color:var(--subtle);white-space:nowrap">${esc(row.handlerName)}</td>
        <td class="kw-cell">
          <div class="kw-pills-wrap">${makePills(row.filterKeywords, "")}</div>
          <input data-filter-keywords type="text" class="field-input kw-input" value="${esc(row.filterKeywords.join(", "))}" />
        </td>
      </tr>`,
        )
        .join("")}
    </tbody>
  </table>`
  }
</div>`;

        el.querySelectorAll(".kw-cell").forEach((cell) => {
          const pillsWrap = cell.querySelector(".kw-pills-wrap");
          const input = cell.querySelector(".kw-input");
          cell.addEventListener("click", () => {
            if (input.style.display === "block") return;
            pillsWrap.style.display = "none";
            input.style.display = "block";
            input.focus();
          });
          const commitEdit = () => {
            const isAliases = input.hasAttribute("data-aliases");
            const vals = input.value
              .split(",")
              .map((v) => v.trim().toLowerCase())
              .filter(Boolean);
            pillsWrap.innerHTML = makePills(vals, isAliases ? "/" : "");
            input.style.display = "none";
            pillsWrap.style.display = "";
          };
          input.addEventListener("blur", commitEdit);
          input.addEventListener("keydown", (e) => {
            if (e.key === "Enter" || e.key === "Escape") input.blur();
          });
        });

        el.querySelector("#cmd-save")?.addEventListener("click", async () => {
          const payloadRows = [
            ...el.querySelectorAll("[data-command-row]"),
          ].map((rowEl) => {
            const command = rowEl.dataset.commandRow;
            const aliasesInput = rowEl.querySelector("[data-aliases]");
            const enabledInput = rowEl.querySelector("[data-enabled]");
            const filterKeywordsInput = rowEl.querySelector(
              "[data-filter-keywords]",
            );
            const existing = rows.find((row) => row.command === command);
            return {
              command,
              aliases: (aliasesInput?.value || "")
                .split(",")
                .map((v) => v.trim().toLowerCase())
                .filter(Boolean),
              isEnabled: Boolean(enabledInput?.checked),
              handlerName: existing?.handlerName || "",
              filterKeywords: (filterKeywordsInput?.value || "")
                .split(",")
                .map((v) => v.trim().toLowerCase())
                .filter(Boolean),
            };
          });
          try {
            const res = await fetch("/api/commands/save", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ commands: payloadRows }),
            });
            const payload = await res.json();
            if (!res.ok) throw new Error(payload.error || `HTTP ${res.status}`);
            const latest = await fetchJSON("/api/commands");
            if (latest) state.commands = latest;
            showToast("Commands saved");
            renderCommandsView(el);
          } catch (err) {
            showToast("Save failed: " + err.message);
          }
        });
      }

      // Config editor─

      let configLocal = null;
      let configSection = null;

      function renderConfigView(el) {
        if (!state.config) {
          el.innerHTML = '<div class="empty">Loading config…</div>';

  </div>
  <div style="display:flex;gap:8px">

</div>
<div class="config-editor">
  <div class="config-nav">

      let label;
      function renderConfigSection(obj, prefix) {
        if (typeof obj !== "object" || obj === null) return "";
        return Object.entries(obj)
          .map(([key, val]) => {
            const path = prefix + "." + key;
            label = key;
            const isReadonly = false;
            const readonlyHint = "";
            const selectOptions = getConfigStringOptions(path);
            if (
              path === "tts.voice" &&
              typeof val === "string" &&
              Array.isArray(selectOptions) &&
              selectOptions.length > 0
            ) {
              return renderVoiceDropdowns(selectOptions, val, path);
            }
            if (typeof val === "boolean") {
              return `<div class="field-card">
  <div class="field-label">${esc(label)}</div>
  <div class="toggle-row">
    <span style="font-family:var(--mono);font-size:12px;color:var(--subtle)">${val}</span>
    <label class="toggle"><input type="checkbox" ${val ? "checked" : ""} onchange="updateConfig('${esc(path)}', this.checked)"><span class="slider"></span></label>
  </div>
</div>`;
            }
            if (typeof val === "number") {
              const isFloat = val % 1 !== 0;
              const step = isFloat ? 0.1 : 1;
              const decimals = isFloat ? 4 : 0;
              return `<div class="field-card">
  <div class="field-label">${esc(label)}</div>
  <div class="number-input">
    <button class="num-btn" onclick="adjustConfigNumber('${esc(path)}', this, -${step}, ${decimals})">−</button>

    <button class="num-btn" onclick="adjustConfigNumber('${esc(path)}', this, ${step}, ${decimals})">+</button>
  </div>
</div>`;
            }
            if (
              typeof val === "string" &&
              Array.isArray(selectOptions) &&
              selectOptions.length > 0
            ) {
              return `<div class="field-card">
  <div class="field-label">${esc(label)}</div>
  <select class="field-input" onchange="updateConfig('${esc(path)}', this.value)">
    ${selectOptions.map((opt) => `<option value="${esc(opt)}" ${opt === val ? "selected" : ""}>${esc(opt)}</option>`).join("")}
  </select>
</div>`;
            }
            if (typeof val === "string" && val.length > 60) {
              return `<div class="field-card" style="grid-column:span 2">
  <div class="field-label">${esc(label)}</div>
  <textarea class="field-input" rows="4" onchange="updateConfig('${esc(path)}', this.value)" oninput="updateConfig('${esc(path)}', this.value)">${esc(val)}</textarea>
</div>`;
            }
            if (Array.isArray(val)) {
              return `<div class="field-card">
  <div class="field-label">${esc(label)} <span style="color:var(--muted)">(comma-sep)</span></div>
  <input class="field-input" type="text" value="${esc(val.join(", "))}" onchange="updateConfig('${esc(path)}', this.value.split(',').map(s=>s.trim()).filter(Boolean))">
</div>`;
            }
            if (typeof val === "object" && val !== null) {
              return `<div class="field-card" style="grid-column:span 2">
  <div class="field-label" style="font-size:12px;color:var(--text);border-bottom:1px solid var(--border);padding-bottom:8px;margin-bottom:12px;text-transform:uppercase;letter-spacing:.06em">${esc(label)}</div>
  <div class="fields-grid">${renderConfigSection(val, path)}</div>
</div>`;
            }
            return `<div class="field-card">
  <div class="field-label">${esc(label)}</div>
  <input class="field-input" type="text" value="${esc(String(val ?? ""))}" onchange="updateConfig('${esc(path)}', this.value)">
</div>`;
          })
          .join("");
      }

      function getConfigStringOptions(path) {
        if (!state.ttsOptions || typeof state.ttsOptions !== "object")
          return null;
        if (path === "tts.voice" && Array.isArray(state.ttsOptions.voices))
          return state.ttsOptions.voices;
        if (path === "tts.model" && Array.isArray(state.ttsOptions.models))
          return state.ttsOptions.models;
        return null;
      }

      function renderVoiceDropdowns(voices, selected, path) {
        const groups = [
          { prefix: "a", label: "English (US)", defaultVoice: "af_sarah" },
          { prefix: "b", label: "English (UK)", defaultVoice: "bf_lily" },
          { prefix: "e", label: "Spanish", defaultVoice: "ef_dora" },
          { prefix: "f", label: "French", defaultVoice: "ff_siwis" },
          { prefix: "h", label: "Hindi", defaultVoice: "hf_beta" },
          { prefix: "j", label: "Japanese", defaultVoice: "jf_gongitsune" },
          { prefix: "p", label: "Portuguese", defaultVoice: "pf_dora" },
          { prefix: "z", label: "Chinese", defaultVoice: "zf_xiaoxiao" },
        ];

        const normalized = voices.map((v) => String(v).trim()).filter(Boolean);
        const remaining = new Set(normalized);

        const dropdowns = groups.map((group) => {
          const matches = normalized.filter((v) => v.startsWith(group.prefix));
          matches.forEach((v) => remaining.delete(v));

          const ordered = [
            ...new Set([
              group.defaultVoice,
              ...matches.filter((v) => v !== group.defaultVoice),
            ]),
          ].filter(Boolean);

          if (ordered.length === 0) return "";

          const selectedValue = ordered.includes(selected)
            ? selected
            : ordered[0];

          const options = ordered
            .map(
              (voice) =>
                `<option value="${esc(voice)}" ${voice === selectedValue ? "selected" : ""}>${esc(voice)}</option>`,
            )
            .join("");

          return `<div class="field-card">
  <div class="field-label">${esc(label)} (${esc(group.label)})</div>
  <select class="field-input" onchange="updateConfig('${esc(path)}', this.value)">
    ${options}
  </select>
</div>`;
        });

        const otherOptions = Array.from(remaining);
        if (otherOptions.length > 0) {
          const selectedValue = otherOptions.includes(selected)
            ? selected
            : otherOptions[0];
          const options = otherOptions
            .map(
              (voice) =>
                `<option value="${esc(voice)}" ${voice === selectedValue ? "selected" : ""}>${esc(voice)}</option>`,
            )
            .join("");
          dropdowns.push(`<div class="field-card">
  <div class="field-label">${esc(label)} (Other)</div>
  <select class="field-input" onchange="updateConfig('${esc(path)}', this.value)">
    ${options}
  </select>
</div>`);
        }

        return dropdowns.filter(Boolean).join("");
      }

      function updateConfig(path, value) {
        const parts = path.split(".");
        let cur = configLocal;
        for (let i = 0; i < parts.length - 1; i++) {
          cur = cur[parts[i]];
          if (!cur) return;
        }
        cur[parts[parts.length - 1]] = value;
        state.configDirty = true;
      }

      function adjustConfigNumber(path, buttonEl, delta, decimals) {
        const input =
          delta < 0
            ? buttonEl.nextElementSibling
            : buttonEl.previousElementSibling;
        if (!input) return;
        const next = Number(
          (Number(input.value || 0) + Number(delta)).toFixed(Number(decimals)),
        );
        input.value = String(next);
        updateConfig(path, next);
      }

      async function saveConfig() {
        try {
          const r = await fetch("/config", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(configLocal, null, 2),
          });
          if (!r.ok) throw new Error(`HTTP ${r.status}`);
          state.config = JSON.parse(JSON.stringify(configLocal));
          state.configDirty = false;
          showToast("Config saved");
        } catch (e) {
          showToast("Save failed: " + e.message);
        }
      }

      async function setChatEnabled(chatId, isEnabled, inputEl) {
        if (!state.config || typeof state.config !== "object") {
          showToast("Config not loaded yet");
          if (inputEl) inputEl.checked = !isEnabled;
          return;
        }
        const prevIds = Array.isArray(state.config?.discord?.allowedChannels)
          ? state.config.discord.allowedChannels
              .map((v) => String(v).trim())
              .filter(Boolean)
          : [];
        const allConversationIds = [
          ...new Set(
            (state.conversations || [])
              .map((c) => String(c.conversationId || "").trim())
              .filter(Boolean),
          ),
        ];
        const hasExplicitEnabledFilter = prevIds.length > 0;
        const baseIds = hasExplicitEnabledFilter ? prevIds : allConversationIds;
        const nextIds = isEnabled
          ? [...new Set([...baseIds, chatId])]
          : baseIds.filter((id) => id !== chatId);
        const normalizedNextIds =
          allConversationIds.length > 0 &&
          nextIds.length >= allConversationIds.length
            ? []
            : nextIds;
        const nextConfig = JSON.parse(JSON.stringify(state.config));
        if (!nextConfig.discord || typeof nextConfig.discord !== "object")
          nextConfig.discord = {};
        nextConfig.discord.allowedChannels = normalizedNextIds;
        try {
          const r = await fetch("/config", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(nextConfig),
          });
          const payload = await r.json().catch(() => null);
          if (!r.ok) throw new Error(payload?.error || `HTTP ${r.status}`);
          state.config = nextConfig;
          state.configDirty = false;
          showToast(`Chat ${isEnabled ? "enabled" : "disabled"}`);
        } catch (err) {
          if (inputEl) inputEl.checked = !isEnabled;
          showToast("Failed to update chat: " + (err?.message || String(err)));
        }
      }

      // Searc

      // Utilitie

      function esc(str) {
        return String(str ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }
      function isInputFocused() {

          el &&

            el.tagName === "TEXTAREA" ||

      }
      function saveLiveInputState() {

      let _toastTimer = null;
      function showToast(msg) {

      // Shell

      const ANSI_MAP = {
        0: "",
        1: "ansi-bold",
        2: "ansi-dim",
        3: "ansi-italic",
        4: "ansi-underline",
        30: "ansi-black",
        31: "ansi-red",
        32: "ansi-green",
        33: "ansi-yellow",
        34: "ansi-blue",
        35: "ansi-magenta",
        36: "ansi-cyan",
        37: "ansi-white",
        90: "ansi-bright-black",
        91: "ansi-bright-red",
        92: "ansi-bright-green",
        93: "ansi-bright-yellow",
        94: "ansi-bright-blue",
        95: "ansi-bright-magenta",
        96: "ansi-bright-cyan",
        97: "ansi-bright-white",
      };

      function ansiToHtml(text) {
        let s = String(text)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/\r/g, "");
        s = s.replace(/\x1b\[([0-9;]*)m/g, (_, codes) => {
          if (!codes || codes === "0") return "</span>";
          const classes = codes
            .split(";")
            .map((c) => ANSI_MAP[c] || "")
            .filter(Boolean);
          return classes.length ? `<span class="${classes.join(" ")}">` : "";
        });
        s = s
          .replace(/\x1b\[[0-9;]*[A-Za-z]/g, "")
          .replace(/\x1b\][^\x07]*\x07/g, "")
          .replace(/\x1b[^\[\]][^\x1b]*/g, "");
        return s;
      }

      function shellPromptStr() {
        const home = state.shell.serverCwd || "/home/user";
        let display = state.shell.cwd || home;
        if (display === home) display = "~";
        else if (display.startsWith(home + "/"))
          display = "~" + display.slice(home.length);
        return `<span class="shell-line-prompt">auroic</span>:<span style="color:#79c0ff">${esc(display)}</span><span style="color:#c9d1d9">$ </span>`;
      }

      function renderShellView(el) {
        const sh = state.shell;
        const outputHtml = sh.output
          .map((entry) => {
            switch (entry.type) {
              case "prompt":
                return `<div class="shell-line">${shellPromptStr()}<span class="shell-line-cmd">${esc(entry.text)}</span></div>`;
              case "stdout":
                return `<div class="shell-line shell-line-stdout">${ansiToHtml(entry.text)}</div>`;
              case "stderr":
                return `<div class="shell-line shell-line-stderr">${ansiToHtml(entry.text)}</div>`;
              default:
                return `<div class="shell-line">${esc(entry.text)}</div>`;
            }
          })
          .join("");

        const isPassword = sh.waitingForPassword;

        el.innerHTML = `<div class="shell-root">
  <div class="shell-toolbar">
    <div class="shell-dots"><span></span><span></span><span></span></div>
    <div class="shell-title">${esc(sh.cwd || "~")} — auroic shell</div>
    <button class="shell-btn" onclick="shellClear()">Clear</button>
    ${sh.running ? '<button class="shell-btn danger" onclick="shellKill()">Ctrl+C</button>' : ""}
  </div>
  <div class="shell-output" id="shellOutput">${outputHtml}${!sh.running ? `<div class="shell-line" style="margin-top:2px">${shellPromptStr()}<span class="shell-cursor" style="display:inline-block;width:7px;height:14px;background:#58a6ff;animation:pulse 1s ease-in-out infinite alternate;vertical-align:text-bottom;margin-left:1px"></span></div>` : ""}</div>
  <div class="shell-input-area">
    <span class="shell-prompt-text">${sh.running ? (isPassword ? "🔒 " : "› ") : "$ "}</span>
    <input id="shellInput" class="shell-input${isPassword ? " password-mode" : ""}" type="text"
      placeholder="${sh.running ? (isPassword ? "Enter password..." : "Send input to process...") : "Type a command..."}"
      autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />
  </div>
  <div class="shell-status-bar">
    <div class="shell-status-indicator">
      <div class="shell-status-dot ${sh.running ? "running" : "idle"}"></div>
      <span>${sh.running ? "Running" : "Idle"}</span>
    </div>
    <span>${sh.cwd || "~"}</span>
    <span>${sh.history.length} in history</span>
  </div>
</div>`;

        const output = document.getElementById("shellOutput");
        if (output) output.scrollTop = output.scrollHeight;

        const input = document.getElementById("shellInput");
        if (input) {
          input.focus();
          input.onkeydown = handleShellKeydown;
        }
      }

      function handleShellKeydown(e) {
        const input = e.target;
        const sh = state.shell;

        // Ctrl+C
        if (e.key === "c" && e.ctrlKey) {
          e.preventDefault();
          if (sh.running) {
            shellKill();
          } else {
            sh.output.push({ type: "stderr", text: "^C" });
            sh.waitingForPassword = false;
            input.value = "";
            scrollShellOutput();
          }
          return;
        }

        if (e.key === "Enter") {
          e.preventDefault();
          const value = input.value;
          input.value = "";

          if (sh.running) {
            // Send raw stdin to running process (works for sudo -S too)
            if (!sh.waitingForPassword) {
              sh.output.push({ type: "stdout", text: value });
            }
            sh.waitingForPassword = false;
            shellSendStdin(value + "\n");
            scrollShellOutput();
          } else {
            const cmd = value.trim();
            if (cmd) executeShellCommand(cmd);
          }
          return;
        }

        if (!sh.running) {
          if (e.key === "ArrowUp") {
            e.preventDefault();
            if (!sh.history.length) return;
            if (sh.historyIndex < sh.history.length - 1) sh.historyIndex++;
            input.value =
              sh.history[sh.history.length - 1 - sh.historyIndex] || "";
            setTimeout(() => {
              input.selectionStart = input.selectionEnd = input.value.length;
            }, 0);
            return;
          }
          if (e.key === "ArrowDown") {
            e.preventDefault();
            if (sh.historyIndex > 0) {
              sh.historyIndex--;
              input.value =
                sh.history[sh.history.length - 1 - sh.historyIndex] || "";
            } else {
              sh.historyIndex = -1;
              input.value = "";
            }
            return;
          }
        }

        if (e.key === "l" && e.ctrlKey) {
          e.preventDefault();
          shellClear();
        }
      }

      async function executeShellCommand(cmd) {
        const sh = state.shell;

        if (cmd === "clear") {
          shellClear();
          return;
        }

        if (cmd.startsWith("cd") && (cmd.length === 2 || cmd[2] === " ")) {
          const target = cmd.slice(3).trim() || sh.serverCwd;
          sh.output.push({ type: "prompt", text: cmd });
          sh.history.push(cmd);
          sh.historyIndex = -1;

          try {
            const cwd = sh.cwd === "~" ? sh.serverCwd : sh.cwd;
            const res = await fetch("/api/shell/exec", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                command: `cd ${shellQuote(target)} && pwd`,
                cwd,
              }),
            });
            const data = await res.json();
            if (!res.ok) {
              sh.output.push({
                type: "stderr",
                text: data.error || "cd failed",
              });
              renderShellView(document.getElementById("content"));
              return;
            }

            await streamSession(data.sessionId, {
              onStdout(d) {
                sh.cwd = d.trim() || sh.cwd;
              },
              onStderr(d) {
                sh.output.push({ type: "stderr", text: d });
              },
              onExit() {},
            });
          } catch (err) {
            sh.output.push({
              type: "stderr",
              text: String(err.message || err),
            });
          }
          renderShellView(document.getElementById("content"));
          return;
        }

        sh.output.push({ type: "prompt", text: cmd });
        sh.history.push(cmd);
        sh.historyIndex = -1;
        if (sh.history.length > 500) sh.history.shift();

        sh.running = true;
        sh.waitingForPassword = false;
        renderShellView(document.getElementById("content"));

        try {
          const cwd = sh.cwd === "~" ? sh.serverCwd : sh.cwd;
          const res = await fetch("/api/shell/exec", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ command: cmd, cwd }),
          });
          const data = await res.json();
          if (!res.ok) {
            sh.output.push({
              type: "stderr",
              text: data.error || `HTTP ${res.status}`,
            });
            sh.running = false;
            renderShellView(document.getElementById("content"));
            return;
          }

          sh.sessionId = data.sessionId;

          // Stream output
          await streamSession(data.sessionId, {
            onStdout(d) {
              sh.output.push({ type: "stdout", text: d });
              // Detect password prompts from sudo or other programs
              if (/(\[sudo\] password|Password:|password for )/i.test(d)) {
                sh.waitingForPassword = true;
              }
              if (state.view === "shell") scrollShellOutput();
            },
            onStderr(d) {
              sh.output.push({ type: "stderr", text: d });
              if (/(\[sudo\] password|Password:|password for )/i.test(d)) {
                sh.waitingForPassword = true;
              }
              if (state.view === "shell") scrollShellOutput();
            },
            onExit() {
              sh.running = false;
              sh.sessionId = null;
              sh.waitingForPassword = false;
              if (state.view === "shell")
                renderShellView(document.getElementById("content"));
            },
          });
        } catch (err) {
          sh.output.push({ type: "stderr", text: String(err.message || err) });
          sh.running = false;
          renderShellView(document.getElementById("content"));
        }
      }

      /**
       * Connect to /api/shell/stream/:sessionId and drive callbacks.
       * Returns a promise that resolves when the session exits.
       */
      function streamSession(sessionId, { onStdout, onStderr, onExit }) {
        return new Promise((resolve) => {
          const es = new EventSource(`/api/shell/stream/${sessionId}`);
          state.shell.sseSource = es;

          es.onmessage = (ev) => {
            let msg;
            try {
              msg = JSON.parse(ev.data);
            } catch {
              return;
            }
            if (msg.type === "stdout") onStdout(msg.data);
            else if (msg.type === "stderr") onStderr(msg.data);
            else if (msg.type === "exit") {
              es.close();
              state.shell.sseSource = null;
              onExit(msg.code);
              resolve(msg.code);
            }
          };

          es.onerror = () => {
            es.close();
            state.shell.sseSource = null;
            onExit(-1);
            resolve(-1);
          };
        });
      }

      async function shellSendStdin(input) {
        const sh = state.shell;
        if (!sh.sessionId) return;
        try {
          await fetch("/api/shell/stdin", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ sessionId: sh.sessionId, input }),
          });
        } catch (err) {
          sh.output.push({
            type: "stderr",
            text: "stdin send failed: " + err.message,
          });
          scrollShellOutput();
        }
      }

      async function shellKill() {
        const sh = state.shell;
        if (!sh.sessionId) return;
        try {
          await fetch("/api/shell/kill", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ sessionId: sh.sessionId, signal: "SIGINT" }),
          });
          sh.output.push({ type: "stderr", text: "^C" });
          scrollShellOutput();
        } catch (err) {
          sh.output.push({
            type: "stderr",
            text: "kill failed: " + err.message,
          });
          scrollShellOutput();
        }
      }

      function shellClear() {
        state.shell.output = [];
        if (state.view === "shell")
          renderShellView(document.getElementById("content"));
      }

      function scrollShellOutput() {
        if (state.view !== "shell") return;
        const output = document.getElementById("shellOutput");
        const input = document.getElementById("shellInput");
        const sh = state.shell;
        if (!output) {
          renderShellView(document.getElementById("content"));
          return;
        }

        const outputHtml = sh.output
          .map((entry) => {
            switch (entry.type) {
              case "prompt":
                return `<div class="shell-line">${shellPromptStr()}<span class="shell-line-cmd">${esc(entry.text)}</span></div>`;
              case "stdout":
                return `<div class="shell-line shell-line-stdout">${ansiToHtml(entry.text)}</div>`;
              case "stderr":
                return `<div class="shell-line shell-line-stderr">${ansiToHtml(entry.text)}</div>`;
              default:
                return `<div class="shell-line">${esc(entry.text)}</div>`;
            }
          })
          .join("");

        output.innerHTML = outputHtml;
        output.scrollTop = output.scrollHeight;

        const promptText = document.querySelector(".shell-prompt-text");
        const isPassword = sh.waitingForPassword;
        if (promptText)
          promptText.innerHTML = sh.running
            ? isPassword
              ? "🔒 "
              : "› "
            : "$ ";
        if (input) {
          input.classList.toggle("password-mode", isPassword);
          input.placeholder = sh.running
            ? isPassword
              ? "Enter password..."
              : "Send input to process..."
            : "Type a command...";
          input.focus();
        }
      }

      function shellQuote(s) {
        return "'" + String(s).replace(/'/g, "'\\''") + "'";
      }

      // Clock

      function updateClock() {
        const el = document.getElementById("sidebarTime");
        if (el) el.textContent = new Date().toLocaleTimeString();
      }
      setInterval(updateClock, 1000);
      updateClock();

      // Init─

      (async function init() {
        connectSSE();
        await Promise.all([refreshAll(), loadConfig()]);
        lucide.createIcons();
        renderView();
      })();
    </script>
  </body>
</html>
