version: '3.8'

services:
  auroic:
    build:
      context: .
      dockerfile: Dockerfile
    image: auroic:latest
    container_name: auroic
    restart: unless-stopped

    network_mode: host

    env_file:
      - .env

    environment:
      - NODE_ENV=production
      - DB_PATH=/app/data/state.db
      - CONFIG_DB_PATH=/app/data/config.db
      - PROFILE_DIR=/app/data/chrome-auroic
      - XDG_RUNTIME_DIR=/tmp/runtime-auroic
      - NODE_OPTIONS=--max-old-space-size=512

    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - /run/user/1000/pipewire-0:/run/user/1000/pipewire-0:ro
      - /tmp:/tmp

    deploy:
      resources:
        limits:
          memory: 3G
        reservations:
          memory: 1G

    ports:
      - "3789:3789"

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3789/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"