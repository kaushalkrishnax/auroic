version: "3.8"

services:
  auroic:
    build:
      context: .
      dockerfile: Dockerfile
    image: auroic:latest
    container_name: auroic
    restart: unless-stopped

    env_file:
      - .env

    environment:
      - NODE_ENV=production
      - DB_PATH=/app/data/state.db
      - CONFIG_DB_PATH=/app/data/config.db
      - XDG_RUNTIME_DIR=/tmp/runtime-auroic
      - NODE_OPTIONS=--max-old-space-size=512
      - PORT=7860

    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - /run/user/1000/pipewire-0:/run/user/1000/pipewire-0:ro
      - /tmp:/tmp

    deploy:
      resources:
        limits:
          memory: 3G
        reservations:
          memory: 1G

    # Updated to map the Hugging Face port
    ports:
      - "7860:7860"

    healthcheck:
      # Updated the healthcheck to hit the correct port
      test: ["CMD", "wget", "-qO-", "http://localhost:7860/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
